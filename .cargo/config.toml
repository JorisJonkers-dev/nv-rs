# Fork-only. Cargo ignores registry versions published less than 7 days ago when it resolves
# (cargo update, a new dependency); versions already in Cargo.lock are kept. A malicious release is
# usually found and pulled within days. Stable from Cargo 1.100, which the fork pins
# (rust-toolchain.toml, listed in .fork/allowed-divergence: upstream pins 1.99.1). Renovate waits
# the same 7 days for crates (renovate.json).
[registry]
global-min-publish-age = "7 days"

# Fork-only. Clippy 1.100's new lints, which upstream's code (built on 1.99.1) does not meet yet in
# about 300 places: allowed here, a fork-owned file, so no upstream file changes for them
# (docs/fork/DIVERGENCE.md, "Toolchain"). Drop a line when upstream's code meets that lint. A
# RUSTFLAGS or CARGO_ENCODED_RUSTFLAGS in the environment replaces this list (the release builds
# set one; they do not run clippy).
[target.'cfg(all())']
rustflags = [
  "-Aclippy::manual_is_multiple_of",
  "-Aclippy::chunks_exact_to_as_chunks",
  "-Aclippy::unnecessary_map_or",
  "-Aclippy::needless_bool",
  "-Aclippy::approx_constant",
  "-Aclippy::manual_repeat_n",
  "-Aclippy::needless_range_loop",
  "-Aclippy::manual_noop_waker",
  "-Aclippy::manual_isolate_lowest_one",
  # Windows-only code (the profiler, the loader).
  "-Aclippy::manual_c_str_literals",
]
