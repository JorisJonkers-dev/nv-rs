# Capital Wasteland far views by landmark, for a Tale of Two Wastelands load order (world editor id "Wasteland"): each
# stands at a map marker plus an offset (world units) and faces a marker; the game's placement settles the player on
# the land. Chosen so that missing distant objects show at a glance.
version = 1

# The ruined skyline of Washington from the south-west with the Washington Monument among the towers: tall far object
# LOD (the monument is the one thing to look for; the broken towers are the mass).
[[place]]
name = "washington-skyline-and-monument"
world = "Wasteland"
ref = "WashMonMapMarker"
dx = 0
dy = -12000
dz = 800
look_at = "WashMonMapMarker"

# The Washington Monument and the Mall across the Potomac, from the bank by the Lincoln Memorial, with the bridge on
# the right: the monument at distance and the far bank's buildings; the bridge is a mid-distance object.
[[place]]
name = "monument-across-the-river"
world = "Wasteland"
ref = "LincolnMemorialMapMarker"
dx = -9000
dy = 0
dz = 800
look_at = "WashMonMapMarker"

# Tenpenny Tower from the plain to the south-west: a tall single building standing alone, the cleanest test of far
# object LOD for one object, with dead trees (tree LOD) and shacks around it.
[[place]]
name = "tenpenny-tower-from-the-plain"
world = "Wasteland"
ref = "TenpennyTowerMapMarker"
dx = -10000
dy = -4000
dz = 800
look_at = "TenpennyTowerMapMarker"
