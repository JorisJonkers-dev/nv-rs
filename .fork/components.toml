# Fork-only. The component map of the engine: what CI verifies, in which order of layers, and where.
# Read by scripts/fork/components.py, which checks that every workspace crate belongs to exactly one component
# and that each component's `requires` cover its crates' real dependencies, and which builds the CI matrix of
# .github/workflows/fork-build.yml. The crate layout and every Cargo.toml are upstream's: this map is the only
# place the fork says what belongs together. docs/fork/CI.md explains how to read and change it.
#
# linux: "required" on a component without crates (commands only) makes its Linux job required and drops its Windows job.
# runs_on: "windows" (upstream's gate is Windows) or "both": the same tests also run on Linux. A "both"
#   component gets a Linux twin that is informational (it may fail without failing the run) until every crate
#   of the component is listed in .fork/linux-ok.txt; then the component runs on Linux only and the Windows job
#   goes away, unless `windows = "required"` (the component holds cfg(windows) code that Linux cannot test).
# pr: "affected" (default): on a pull request the component runs only if a crate of its test closure changed;
#   "always" runs it on every pull request that builds. Pushes to the integration branch, the schedule and a
#   manual run test every component.
# jobs: an optional split INSIDE a component, along module boundaries of the tests (see integration).
# paths: files outside the workspace that belong to a component (a change there runs the component).
# commands: for a component that is not made of workspace crates; replaces `cargo test -p`.
# extra: commands run after the component's tests, in the same job.

[defaults]
# A workspace crate that no component and no rule claims fails the check: a new upstream crate is never
# silently untested. A crate claimed only by a rule is reported as "assigned by rule" (a warning).
unassigned = "fail"

[[component]]
name = "core"
purpose = "The engine's foundation: the game's memory model, the Engine, the exe mapping, the CRT, the typed re-implementations above the core, and the frame model"
crates = ["engine-core", "engine-typed", "frame-model"]
requires = ["hitch", "qos"]
runs_on = "both"
windows = "required"

[[component]]
name = "formats"
purpose = "File formats and codecs of the game's data: plugins (esm), archives (bsa), saves (fos), Bink, MP3, Ogg Vorbis and the D3DX texture loader"
crates = ["esm", "bsa", "fos", "bink", "mp3", "vorbis", "d3dx-tex"]
requires = []
runs_on = "both"
# The texture crate's other arithmetic path (upstream ci.yml): truncation done in software.
extra = [
  "cargo test --locked -p d3dx-tex --features software-truncation",
  "cargo clippy --locked -p d3dx-tex --all-targets --features software-truncation -- -D warnings",
]

[[component]]
name = "engine-base"
purpose = "The middleware the game is built on, translated: Gamebryo (scene graph, animation, collision, particles), Havok (physics), SpeedTree and the Bethesda units (audio, menu, movie, shader)"
crates = ["engine-gamebryo", "engine-speedtree", "engine-havok", "engine-bs"]
requires = ["core"]
runs_on = "both"

[[component]]
name = "fallout-world"
purpose = "Fallout's world data: forms and the data handler, references and cells, land and water, sky and regions, FaceGen, saves"
crates = ["engine-fallout-facegen", "engine-fallout-cell", "engine-fallout-forms", "engine-fallout-env"]
requires = ["core", "engine-base"]
runs_on = "both"

[[component]]
name = "fallout-gameplay"
purpose = "Fallout's rule systems: scripts, conditions and quests, magic and effects, pathfinding, AI"
crates = ["engine-fallout-script", "engine-fallout-magic", "engine-fallout-pathfinding", "engine-fallout-ai"]
requires = ["core", "engine-base", "fallout-world"]
runs_on = "both"

[[component]]
name = "fallout-front"
purpose = "Fallout's front end and the rest: menus and dialogue, the main loop, audio, and the not-yet-placed runs of the exe"
crates = ["engine-fallout-interface", "engine-fallout-misc", "engine-fallout-unplaced-a", "engine-fallout-unplaced-b"]
requires = ["core", "engine-base", "fallout-world", "fallout-gameplay"]
runs_on = "both"

[[component]]
name = "scripting"
purpose = "The script extenders built in: xNVSE's commands, JIP LN NVSE's commands, UI Organizer, the mod settings menu's plugin, lStewieAl's Tweaks and the identities of JohnnyGuitar NVSE and ShowOff xNVSE, kNVSE's animation-path overrides and the AnhNVSE commands mods call"
crates = ["nvse", "jip", "johnnyguitar", "jg", "showoff", "knvse", "stewie", "uio", "mcm", "ttw-nvse", "anh-nvse", "plugin-host"]
requires = ["core", "log"]
runs_on = "both"
# The recorded real-game math results include tan and tanh cases that only Windows' libm reproduces bit for bit
# (nvse commands/math.rs); they are ignored elsewhere, so the component also runs on Windows.
windows = "required"

[[component]]
name = "window-layer"
purpose = "The window layer off Windows: a winit window thread for X11 and Wayland, the handle registry, the wgpu surface and DirectInput-shaped input (docs/fork/LINUX.md). Fork-owned; Windows keeps engine-platform's window thread"
crates = ["fork-window"]
requires = ["log"]
runs_on = "both"

[[component]]
name = "presence"
purpose = "Discord Rich Presence: a background thread shows the running game on the player's Discord (docs/fork/DISCORD.md). Fork-owned"
crates = ["fork-presence"]
requires = ["log"]
runs_on = "both"

[[component]]
name = "scene"
purpose = "Scene capture (nv-rs#479): the place file and the request the engine reads at start (NV_SCENE), pure (docs/fork/SCENE.md); the engine side, fork-scene-run, is in integration with the host. Fork-owned"
crates = ["fork-scene"]
requires = []
runs_on = "both"

[[component]]
name = "gfx"
purpose = "Graphics settings (nv-rs#592, ADR-0019): the schema each graphics module declares, the per-profile settings file with layers by place, presets as data and the schema as JSON for raul; pure (no engine, no game data). Fork-owned"
crates = ["fork-gfx"]
requires = []
runs_on = "both"

[[component]]
name = "catalogue"
purpose = "The coverage catalogue's typed ids (docs/fork/CATALOGUE.md): generated by build.rs from .fork/catalogue with tally's generator; the fork-owned tests call covers() with them. Fork-owned"
crates = ["fork-catalogue"]
requires = []
runs_on = "both"
paths = [".fork/catalogue/"]

[[component]]
name = "overlay"
purpose = "The in-game graphics overlay (nv-rs#592, nv-rs#730, ADR-0019): an egui panel generated from the graphics modules' schemas, with a font made from the port's own bitmap glyphs, drawn by egui-wgpu at the present after the window's capture. Fork-owned"
crates = ["fork-overlay"]
requires = ["gfx"]
runs_on = "both"

[[component]]
name = "memlog"
purpose = "The NV_MEMLOG memory timeline: one key=value line of guest heap, host RSS and GPU counters, off by default (docs/fork/MEMLOG.md). Fork-owned"
crates = ["fork-memlog"]
requires = []
runs_on = "both"

[[component]]
name = "log"
purpose = "Logging: levels and targets, text on stderr, JSON lines in a file, a panic and stop reporter, the soft-stop policy NV_STOP_POLICY (docs/fork/LOGGING.md). Fork-owned"
crates = ["fork-log"]
requires = []
runs_on = "both"

[[component]]
name = "hitch"
purpose = "The hitch flight recorder: a per-frame ring, hitch detection with cause and trigger, a sampler for a stuck frame, the per-run summary file (docs/fork/HITCHES.md). Fork-owned"
crates = ["fork-hitch"]
requires = ["log"]
runs_on = "both"

[[component]]
name = "qos"
purpose = "Windows' quality-of-service hint: the game's threads told they are not background work (NV_NOT_BACKGROUND, bNotBackground); nothing off Windows"
crates = ["qos"]
requires = []
runs_on = "both"

[[component]]
name = "ds-mix"
purpose = "DirectSound's mixer, the two sample-rate converters, speaker placement, the 3D stage, the distortion effect and the sound output (macOS's cpal device, Windows' WASAPI arm; Linux plays through the fork's fork_sound.rs), used by the platform layer"
crates = ["ds-mix"]
requires = ["qos", "log"]
runs_on = "both"

[[component]]
name = "game-folders"
purpose = "Off Windows: the game's installs (Steam, Heroic, Lutris), the Proton and Wine saves, the player's folders nv-rs never writes into and nv-rs's own folder, as plain functions over a home folder (nv-viewer --find, the save guard)"
crates = ["game-folders"]
requires = []
runs_on = "both"

[[component]]
name = "game-profile"
purpose = "nv-rs's own sections in the game's Fallout.ini and the play lines of FalloutPrefs.ini, shared by Play.exe (Windows, scripts/launcher) and the host's first start off Windows"
crates = ["game-profile"]
requires = []
runs_on = "both"

[[component]]
name = "facade"
purpose = "The typed in-process facade a program that links the engine (the Toolbox's raul) depends on: the readers re-exported, a save's summary as owned values, the capabilities file and the facade's version. Fork-owned"
crates = ["fork-api"]
requires = ["formats", "game-profile", "game-folders", "integration"]
runs_on = "both"
# The installation check behind the feature `engine` (it builds the whole engine closure).
extra = [
  "cargo test --locked -p fork-api --features engine",
  "cargo clippy --locked -p fork-api --all-targets --features engine -- -D warnings",
]

[[component]]
name = "play"
purpose = "The play-mode entry point of the engine for a program that links it (the Toolbox's raul): the viewer's loop behind play_main, the stop file, the exit codes, and the guard that the viewer's dependencies are this crate's too. Fork-owned. Builds the whole engine closure"
crates = ["fork-play"]
requires = ["integration", "core", "rendering", "platform", "presence", "memlog", "log", "hitch", "game-folders", "mod-chooser", "mod-install"]
runs_on = "both"

[[component]]
name = "fomod"
purpose = "FOMOD mod installers read (ModuleConfig.xml, info.xml) and the player's choices turned into the files to copy into Data; no archives, no window, no game data"
crates = ["fomod"]
requires = []
runs_on = "both"

[[component]]
name = "mod-archive"
purpose = "Mods' archives opened by nv-rs itself on every system: zip and 7z listed and unpacked into a folder, with plain-worded errors; nothing is written outside the folder it is given"
crates = ["mod-archive"]
requires = []
runs_on = "both"

[[component]]
name = "mod-install"
purpose = "The port's own mods folders on every system: installed mods (one folder each, with a record, in order), removing them, and the whole game folder \"Play with mods\" plays from; never writes the game's own folder"
crates = ["mod-install"]
requires = []
runs_on = "both"

[[component]]
name = "mod-chooser"
purpose = "The mod installer's text front end on every system: lists the mods to install and the installed ones, asks each FOMOD installer's questions in plain words, unpacks into the port's mod installs folder and removes mods"
crates = ["mod-chooser"]
requires = ["fomod", "mod-archive", "mod-install"]
runs_on = "both"

[[component]]
name = "nv-launcher"
purpose = "nv-rs's one launcher, themed like the game's terminal: the start screen, Settings and Play (Play.exe on Windows, nv-rs on Linux and macOS)"
crates = ["nv-launcher"]
requires = ["formats", "game-profile", "game-folders", "mod-install", "ds-mix"]
runs_on = "both"

[[component]]
name = "rendering"
purpose = "The renderer back end: the recorded Direct3D 9 call stream and its wgpu backend with the shader-bytecode-to-WGSL converter (wgpu 30.0.1 with the vendored wgpu-hal), the shader compiler seam off Windows (cache and libvkd3d-shader), and the fork-owned replay-bench that times a recorded stream through a null, the wgpu and a raw Vulkan backend (docs/fork/REPLAY.md)"
crates = ["d3d9-stream", "d3d9-wgpu", "d3dx-shader", "d3d9-replay"]
requires = ["formats", "window-layer", "log", "hitch", "qos", "gfx", "overlay"]
runs_on = "both"
windows = "required"

[[component]]
name = "platform"
purpose = "The Windows platform layer: window, Direct3D 9 and D3DX entry points, DirectInput, DirectSound, DirectShow, files, loader and process"
crates = ["engine-platform"]
requires = ["core", "formats", "rendering", "log", "hitch", "qos", "ds-mix"]
runs_on = "both"
# The Windows entry points are cfg(windows) code that only Windows can test; the Linux job runs the rest, among it the
# shader compiler seam's tests against a recent libvkd3d-shader (docs/fork/CI-NIX.md).
windows = "required"

[[component]]
name = "integration"
purpose = "The assembled engine and the host: the differential tests of every typed family against its translation, and the program that runs the game. The slow part of CI: the engine crate links all 19 engine crates"
crates = ["engine", "host", "play-patch", "fork-scene-run", "nv-viewer"]
requires = ["core", "formats", "engine-base", "fallout-world", "fallout-gameplay", "fallout-front", "scripting", "rendering", "platform", "presence", "memlog", "log", "hitch", "qos", "game-folders", "game-profile", "mod-chooser", "mod-install", "scene", "gfx"]
runs_on = "windows"
# The typed jobs are sized by measured test time (about 7 minutes of tests each, 2026-11-23 run: the one runtime job took
# 36 minutes alone, mostly binaries run one after another with few tests each); a family goes in a job of its own when
# its binary is the longest.
# These run when anything under them changed (about 9 in 10 code commits reach them), so they are split along
# the typed families: one test binary per family, mirroring engine-typed's modules, grouped by subject and not
# by size. Every file of crates/engine/tests must be named in a job (checked), so a new test file cannot be lost.
#
# `optional_tests` of a job: "crate/test" names of test files upstream is about to add. The map is fork-owned, so
# it cannot name a file before the commit that adds it is replayed, and that replay's own checks would fail on the
# file being in no job. An optional test is not an error when absent and is run (appended to the job's `-p crate`
# command that already lists tests) when present.
#
# `config` of a job: cargo `--config` settings for its commands. The typed jobs run the three crates that hold the
# differential harness and the typed families at opt-level 1: debug assertions and overflow checks stay on (the
# direct run of every case needs them), and the tests ran 2.6 times faster for no more compile time (measured on
# typed_culling, docs/fork/TEST-REDESIGN.md). The translations in the other crates stay at opt-level 0: opt-level 1
# for them too is 5 times faster but compiles 5.5 minutes longer.
[[component.job]]
name = "typed shader family"
# 307 tests, 973 s of the slowest job (compile 297 s): three shards of the one binary (run-component.sh, SHARD) bring the tests to about a third.
shards = 3
args = ["-p engine --test typed_shader"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed draw"
args = ["-p engine --test typed_draw --test draw_pass_state"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed render, lights, particles"
args = ["-p engine --test typed_render --test typed_lights --test typed_particles --test typed_multibound"]
# engine-typed stays at opt-level 0 here: at opt-level 1 the compiler changes which NaN payload a float expression keeps (`lights_update_start`, `xd_rotation_matrix` differ in one payload byte on NaN inputs; both pass at opt-level 0, upstream's test profile, and with engine-core and engine at 1).
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed culling"
args = ["-p engine --test typed_culling --test typed_fade --test compact_culling"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed dispatch and collision"
args = ["-p engine --test typed_dispatch --test typed_collision"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed geometry"
args = ["-p engine --test typed_geometry"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed pathing"
args = ["-p engine --test typed_pathing"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed animation"
args = ["-p engine --test typed_animation --test typed_anim_keys"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
# typed_hud_idle (one test, 135 to 142 s) runs in 5/5: with it, 1/5 was the longest runtime job (15 m 38 s in run 45675930207,
# typed_process 390 s of it), 5/5 the shortest (9 m 03 s).
name = "typed runtime 1/5: process, leaves"
args = ["-p engine --test typed_process --test typed_leaves --test typed_lockfree"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed runtime 2/5: facegen pass, crt, scripts"
args = ["-p engine --test typed_facegen_pass --test typed_after_draw --test typed_crt --test typed_script_run"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed runtime 3/5: HUD, setup, scripts"
args = ["-p engine --test typed_hud --test typed_setup --test typed_scripts --test typed_ai_queries --test typed_archives --test typed_cell_refs"]
# engine-typed stays at opt-level 0 here: at opt-level 1 the compiler changes which NaN payload a float expression keeps (`lights_update_start`, `xd_rotation_matrix` differ in one payload byte on NaN inputs; both pass at opt-level 0, upstream's test profile, and with engine-core and engine at 1).
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
# 4/5 and 5/5 were one job, the longest of a push run (19 to 26 min on Windows: 13 to 19 min of tests one binary after
# another). Split by measured test time (run 45652900290, s): colours 206, coords 243, matrix 110 | facegen 159, head 44,
# save 131, script lines 218, script params 22: about 9.5 min of tests each.
name = "typed runtime 4/5: facegen colours, coords, matrix, sizes, navmesh edges"
args = ["-p engine --test typed_facegen_colours --test typed_facegen_coords --test typed_facegen_matrix --test typed_facegen_sizes --test typed_navmesh_edges"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed runtime 5/5: facegen, save, script lines, idle HUD"
args = ["-p engine --test typed_facegen --test typed_save --test typed_script_lines --test typed_facegen_head --test typed_script_params --test typed_hud_idle"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed AI processes"
args = ["-p engine --test typed_ai_process --test typed_ai_low_process --test typed_ai_middle_low_process"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed interface"
args = ["-p engine --test typed_interface"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "typed forms"
args = ["-p engine --test typed_forms"]
config = ["profile.dev.package.engine-core.opt-level=1", "profile.dev.package.engine-typed.opt-level=1", "profile.dev.package.engine.opt-level=1"]
[[component.job]]
name = "aggregator: engine lib, doctests and par_render, host, play-patch, viewer"
args = ["-p host -p play-patch -p nv-viewer -p fork-scene-run", "-p engine --lib --test par_render --test real_scda --test jip_call_arity --test jg_editor_ids_compile --test stewie_fixes --test recursive_lock_publication --test par_bones --test scrap_heap_publication --test node_pool_publication --test menu_mouse_move --test save_changes_map --test save_maps --test menu_tiles --test water_clip_plane --test xinput_pad --test xnvse_inline_arguments --test xnvse_line_reader --test havok_bodies --test par_manager --test par_tasks --test diff_reference_peer", "-p engine --doc"]
optional_tests = ["engine/capture_run_mode"]

[[component]]
name = "repo-checks"
purpose = "What must never be committed (the repository's hygiene tests)"
crates = ["nvinspect"]
requires = []
runs_on = "both"
# It reads the whole repository, so any change can break it.
pr = "always"

# The native build's saves, end to end: the game's file calls on `Z:` paths, the copy-out into the port's own Saves folder and a
# new run reading it back, with the failure cases (docs/fork/LINUX.md). Linux only: the test is cfg(unix), and `host` is also in
# the `integration` component, which builds on Windows. `linux = "required"`: a required Linux job and no Windows job.
[[component]]
name = "native-saves"
purpose = "Saving on Linux end to end without game data: the game's save calls through the engine's file layer, the copy-out landing the files with sync and rename, the folder listed and read back by a new run, and the write failures that must be logged, never stop the game"
crates = []
requires = ["core", "formats", "engine-base", "fallout-world", "fallout-gameplay", "fallout-front", "scripting", "rendering", "platform", "presence", "memlog", "hitch"]
runs_on = "both"
linux = "required"
pr = "affected"
paths = ["crates/host/tests/linux_saves.rs", "crates/host/src/save_out.rs", "crates/engine-platform/src/files.rs"]
commands = [
  "cargo test --locked -p host --test linux_saves",
  "cargo test --locked -p engine-platform --lib files::",
]

# Separate workspaces (their own Cargo.toml and target): not workspace members, so no crate list.
[[component]]
name = "launcher-and-ledger"
purpose = "The ledger of typed markers (a small workspace that upstream's CI builds on Windows) and the distribution files; Play.exe is crates/nv-launcher now, a member of the main workspace"
crates = []
requires = []
runs_on = "windows"
paths = ["scripts/ledger/", "distribution/"]
commands = [
  "cargo test --locked --manifest-path scripts/ledger/Cargo.toml",
]

# The release files (docs/fork/RELEASE-FILES.md): a separate workspace that reads the command tables of nvse and jip, so
# it runs on every pull request that builds (a table change without the regenerated .fork/capabilities.json fails it).
[[component]]
name = "release-files"
purpose = "capabilities.json and release-manifest.json: written from the built-in extenders' command tables, validated against the schemas in .fork/schemas, and the checked-in capabilities file compared with the tables"
crates = []
requires = ["core", "scripting"]
runs_on = "both"
pr = "always"
paths = ["scripts/fork/release-files/", ".fork/schemas/", ".fork/capabilities.json"]
commands = [
  "cargo fmt --manifest-path scripts/fork/release-files/Cargo.toml -- --check",
  "cargo test --locked --manifest-path scripts/fork/release-files/Cargo.toml",
  "cargo clippy --locked --manifest-path scripts/fork/release-files/Cargo.toml --all-targets -- -D warnings",
]

# Fallbacks for crates upstream adds later (reported as warnings; never silently untested).
[[rule]]
match = "engine-fallout-*"
component = "fallout-front"
[[rule]]
match = "d3d9-*"
component = "rendering"
[[rule]]
match = "engine-*"
component = "engine-base"
