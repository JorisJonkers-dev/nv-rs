# gitleaks config for JorisJonkers-dev repos. Extends the upstream default ruleset;
# add repo-specific allowlist entries below for known-safe test fixtures.
title = "JorisJonkers-dev gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  # upstream's keystroke-replay code: field names such as keys2_delay_ms trip generic-api-key (false positive).
  '''^research/nv-trace/nv-trace-rec/src/lib\.rs$''',
  '''(.*?)(example|sample|fixture|test)(.*?)\.(env|json|ya?ml)$''',
  # identity's conformance vectors, vendored by scripts/pin-contract.sh: tokens signed by a test key.
  '''^contract/vectors/''',
  # The key the reader's own tests sign with.
  '''^tests/testdata/''',
  # The coverage catalogue's pins: SHA-256 digests of upstream files whose names contain "API" or "Token".
  '''^\.fork/catalogue/sources\.toml$''',
]
regexes = [
  '''EXAMPLE_[A-Z0-9_]+''',
  # The placeholder key in the launcher's test crash-report DSN: only this exact value, in any form
  # of the commit (upstream, replayed or squashed). Every other key is still reported.
  '''^0123456789abcdef(0123456789abcdef)?$''',
]
