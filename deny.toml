# cargo-deny configuration. Run locally with `cargo deny check`.
# The project itself is GPL-3.0-or-later; every third-party licence allowed
# below is compatible with it.

[graph]
# Only the two targets the project actually builds for. This keeps the
# cfg(windows)-only dependencies (windows 0.58) in the graph.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Add RUSTSEC ids here only with a comment saying why the advisory does not
# apply; an empty list is the default and the goal.
ignore = []
yanked = "warn"

[licenses]
version = 2
allow = [
    # The project's own licence, on the workspace crates (they are not publish = false, so not "private").
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

# Workspace crates are all 0.1.0 and unpublished (several are publish = false),
# so their own GPL-3.0-or-later licence must not be checked against `allow`.
[licenses.private]
ignore = true

[bans]
# hashbrown currently resolves twice; warn so the duplicate is visible in the
# log without failing the build.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
