# Fork-only. `task check` is what the fork's Pipeline Complete job runs, so local and CI cannot drift.
# Upstream's own build and test gate is .github/workflows/ci.yml (Windows) and is not repeated here.
version: "3"

tasks:
  default:
    cmd: task --list
    silent: true

  lint:actions:
    desc: actionlint on every workflow, shellcheck on the fork's shell scripts, zizmor on the fork's own workflows (upstream's are not ours to change)
    cmds:
      - actionlint
      - shellcheck scripts/fork/*.sh scripts/fork/local/lib.sh scripts/fork/local/nv-rs-dev packaging/linux/*.sh packaging/linux/nv-rs-launch packaging/macos/*.sh
      - zizmor --offline --no-progress .github/workflows/fork-*.yml .github/workflows/release.yml

  deny:
    desc: Licences, bans, sources and advisories (deny.toml)
    cmd: cargo deny check

  scripts:
    desc: Self-tests of the fork's scripts (no network, no GitHub, nothing created)
    cmds:
      - python3 -I scripts/fork/test_wif.py
      - python3 -I scripts/fork/check_data_gates.py
      - python3 -I scripts/fork/public_text.py
      - python3 -I scripts/fork/public_text.py --selftest
      - python3 -I scripts/fork/setup-anthropic-wif.py --selftest
      - python3 -I scripts/fork/create-app.py --selftest
      - python3 -I -m unittest discover -s scripts/fork/tests -v

  components:
    desc: Check the component map against the workspace (every crate in one component, every test file in a job) and print the job matrix of a full run
    cmds:
      - python3 -I scripts/fork/components.py check
      - python3 -I scripts/fork/components.py matrix --event push | jq -r '.include[].name'

  capabilities:
    desc: Rewrite .fork/capabilities.json from the command tables (run it after a sync or a change to a command table; the release-files test fails until you do)
    cmd: cargo run --locked --quiet --manifest-path scripts/fork/release-files/Cargo.toml -- capabilities --out .fork/capabilities.json

  catalogue:
    desc: Rewrite the coverage catalogue's reference lists and pins (.fork/catalogue/ref, sources.toml) from the pinned sources, write the evidence files tally reads, and run `tally check` (needs tally on PATH; docs/fork/CATALOGUE.md)
    cmds:
      - mkdir -p target/catalogue
      - cargo run --locked --quiet --release --manifest-path scripts/ledger/Cargo.toml -- --tsv target/catalogue/ledger.tsv >/dev/null
      - git checkout -- docs/LEDGER.md
      - cargo run --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml -- fetch --sources target/catalogue/pins
      - cargo run --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml -- catalogue --sources target/catalogue/pins --ledger target/catalogue/ledger.tsv --evidence target/catalogue/evidence.tsv
      - tally check --catalogue .fork/catalogue

  secrets:
    desc: Scan every commit for secrets
    cmd: gitleaks git --redact --no-banner --config .gitleaks.toml .

  check:
    desc: Everything the fork's CI runs on a pull request
    cmds:
      - task: lint:actions
      - task: deny
      - task: scripts
      - task: secrets
