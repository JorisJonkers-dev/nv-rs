[package]
name = "jg"
version = "0.1.0"
description = "JohnnyGuitar NVSE built in: its identity (name, DLL, version, opcode base) for IsPluginInstalled and GetPluginVersion and its co-save section kept; its commands follow, written from public documentation"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
nvse = { path = "../nvse" }

[dev-dependencies]
# Every command test checks that each argument is read as its parameter type stores it.
nvse = { path = "../nvse", features = ["test-support"] }
# The coverage catalogue's ids: tests say which commands they prove (docs/fork/CATALOGUE.md).
fork-catalogue = { path = "../fork-catalogue" }
