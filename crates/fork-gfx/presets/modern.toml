# The Modern preset: the original picture with the engine's own effects on at their middle levels.
# A preset is a settings file (docs/fork/adr/0019-graphics-modules.md); a value set in the
# profile's own file wins over it.
version = 1

[global.ao]
enabled = true
quality = "medium"
strength = 0.7

[global.shadows]
enabled = true
quality = "medium"

[global.light]
ambient_exterior = 0.7
ambient_interior = 1.0
ambient_night = 1.0
sun = 0.65
moon = 0.75
moon_max_height = 45.0
moon_specular = 2.0
# 16: at the game's default light fade (start 1000, dropped at 1500) a lamp fades from 16,000 units and is
# dropped past 24,000; the 5x5 loaded cells end at most about 17,400 units from the camera, so no lamp the game
# has loaded is dropped (nv-rs#911).
lamp_distance = 16.0
far_lights = true
sky_dome = 1.0
shade_fill = 0.2

[global.water]
placed_reflections = "high"

[global.textures]
anisotropy = "x16"
dither = true
