# The Modern preset: the original picture with the engine's own effects on at their middle levels.
# A preset is a settings file (docs/fork/adr/0019-graphics-modules.md); a value set in the
# profile's own file wins over it.
version = 1

[global.ao]
enabled = true
quality = "medium"
strength = 0.7

[global.shadows]
enabled = true
quality = "medium"

[global.light]
ambient_exterior = 0.7
ambient_interior = 1.0
ambient_night = 1.0
sun = 0.65
moon = 0.75
moon_max_height = 45.0
moon_specular = 2.0
sky_dome = 1.0
shade_fill = 0.2

[global.textures]
anisotropy = "x16"
