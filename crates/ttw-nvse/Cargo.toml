[package]
name = "ttw-nvse"
version = "0.1.0"
description = "The script extender plugin Tale of Two Wastelands ships (ttw_nvse, its readers call it ROOGNVSE) built in: TTW_GetPlugins and TTW_EnableRadioFix, written from public documentation and how TTW's scripts call them"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
engine-core = { path = "../engine-core" }
nvse = { path = "../nvse" }

[dev-dependencies]
# Every command test checks that each argument is read as its parameter type stores it.
nvse = { path = "../nvse", features = ["test-support"] }
