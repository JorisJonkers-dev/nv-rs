[package]
name = "fork-api"
version = "0.1.0"
description = "Fork-owned typed in-process facade of the engine's crates for a program that links them (raul): the readers re-exported, owned summaries, the capabilities file and the facade's version"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The base facade has no external dependency: it is the four reader crates, none of which has one. The
# feature `engine` adds the engine's crates (through `host`).
[dependencies]
esm = { path = "../esm" }
fos = { path = "../fos" }
game-folders = { path = "../game-folders" }
game-profile = { path = "../game-profile" }
host = { path = "../host", optional = true }

[features]
default = []
# The installation check (check.rs): it lives in `host`, so this brings the whole engine closure.
engine = ["dep:host"]

[dev-dependencies]
fos = { path = "../fos", features = ["write"] }
