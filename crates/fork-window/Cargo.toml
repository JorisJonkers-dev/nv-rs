[package]
name = "fork-window"
version = "0.1.0"
description = "Fork-owned window layer for platforms other than Windows: a window thread, a handle registry, a wgpu surface from raw handles and DirectInput-shaped input (docs/fork/LINUX.md, stage 4)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Pinned with d3d9-wgpu (ADR-0007): the surface is made on the instance the device layer opens.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan"] }
raw-window-handle = "=0.6.2"
fork-log = { path = "../fork-log" }

# X11 and Wayland (Wayland's libraries are loaded at run time: one binary runs on both sessions).
# macOS and others slot in as another module under `platform/`.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# Idle inhibit (winit has none): zwp_idle_inhibit_manager_v1 on the window's own Wayland connection. The same versions winit
# resolves to (they are in the tree already); `system` shares winit's libwayland connection, `dlopen` keeps it loaded at run time.
wayland-client = { version = "=0.31.15", default-features = false, features = ["system", "dlopen"] }
wayland-protocols = { version = "=0.32.13", default-features = false, features = ["client", "unstable"] }

# macOS: AppKit through winit, its loop on the program's main thread (`run_on_main_thread`), and the window's
# CAMetalLayer, made on that thread, on which the device layer makes its Metal surface. The versions the workspace
# already locks (d3d9-wgpu's macOS test, upstream's winit layer).
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
raw-window-metal = "=1.1.0"

[[example]]
name = "clear"
path = "examples/clear.rs"

# macOS: a window of this layer on the program's real main thread (`run_on_main_thread`): its own
# main, no test harness.
[[test]]
name = "macos_window"
path = "tests/macos_window.rs"
harness = false
