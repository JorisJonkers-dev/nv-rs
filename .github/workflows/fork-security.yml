# Fork-only. Vulnerability scanning that does not need a pull request to find something:
#  * dependency-review: a pull request that adds a dependency with a known advisory fails;
#  * advisories: the RustSec database against Cargo.lock every day, because a new advisory against an
#    unchanged lockfile is the common case. A failed run is the alert.
# GitHub's own scanning (Dependabot alerts, secret scanning with push protection, CodeQL default setup,
# private vulnerability reporting) is switched on by scripts/fork/setup-repo.sh.
name: Fork Security

on:
  pull_request:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: fork-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  advisories:
    name: RustSec advisories
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true
      - run: mise exec -- cargo deny check advisories
