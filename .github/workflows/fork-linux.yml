name: Fork Linux

# Compile-and-test check for the non-Windows code paths. This job is NOT a
# required status check: the game only plays on Windows, so a red Linux run
# must never block a merge. See .github/workflows/ci.yml for the real gate.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 4.4M lines of Rust: the default runner image does not have room for a
      # full debug build of the workspace plus the toolchain caches.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          sudo apt-get clean
          df -h /

      # A single rustc invocation on the largest crates can exceed the 16 GB
      # the runner has; swap keeps the OOM killer away instead of failing the job.
      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show
          free -h

      # Reads rust-toolchain.toml (channel, profile minimal, rustfmt + clippy).
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # cargo fmt is deliberately absent: the Windows job already enforces it.
      - name: Clippy
        continue-on-error: false
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        continue-on-error: false
        run: cargo test --locked --workspace
