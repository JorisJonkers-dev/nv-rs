# Fork-only. The window layer's smoke test (docs/fork/LINUX.md, "Window and input"): opens a window under Xvfb, makes a wgpu
# surface on Mesa's software Vulkan driver (lavapipe), shows 30 cleared frames and exits 0. Not required, and not part of
# Pipeline Complete: it needs a display stack that can fail for reasons of the runner. It runs on a change to the layer.
name: Window smoke

on:
  pull_request:
    paths: ['crates/fork-window/**', 'crates/engine-platform/src/fork_d3d9rec.rs', '.github/workflows/fork-window-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: window-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Window smoke (Xvfb, lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: window-smoke
          save-if: false
      - name: Display and software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libxkbcommon-x11-0 libxcursor1 libxi6 libvulkan1 mesa-vulkan-drivers vulkan-tools
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          echo "VK_ICD_FILENAMES=${icds[0]}" >>"$GITHUB_ENV"
      - name: Build
        run: cargo build --locked -p fork-window --example clear
      - name: Smoke (X11)
        env:
          WINIT_UNIX_BACKEND: x11
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' target/debug/examples/clear --smoke | tee smoke.txt
          grep -q 'smoke: 30 frames shown' smoke.txt
          grep -q '^display: monitor ' smoke.txt
          { echo '### Window smoke'; echo '```'; cat smoke.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Monitor query, then windows, on one event loop (X11)
        env:
          WINIT_UNIX_BACKEND: x11
          NV_WINDOW_SMOKE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' cargo test --locked -p fork-window --test one_loop -- --nocapture 2>&1 | tee loop.txt
          grep -q 'test result: ok. 1 passed' loop.txt
      # #214 and #218: the window after it is made (title, SetWindowPos, minimise and restore, a display change) and the
      # borderless full screen, read back from the X server. No window manager runs under Xvfb: `fork_window::probe::FakeWm`
      # stands in for one in the tests that need it. The test binaries are separate processes, so they run one after another.
      - name: Window state and full screen (X11)
        env:
          WINIT_UNIX_BACKEND: x11
          NV_WINDOW_SMOKE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' cargo test --locked -p fork-window --test window_state --test full_screen -- --nocapture 2>&1 | tee state.txt
          grep -q 'test result: ok. 5 passed; 0 failed; 1 ignored' state.txt
          grep -q 'test result: ok. 2 passed' state.txt
      - name: Guest program, the game's window calls and Reset (X11)
        env:
          WINIT_UNIX_BACKEND: x11
          NV_WINDOW_SMOKE: '1'
          # The check reads an info line, which a quiet terminal keeps in the files.
          NV_LOG_TERM: normal
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' cargo test --locked -p engine-platform --lib d3d9real::fork::tests -- --nocapture 2>&1 | tee guest.txt
          grep -q 'test result: ok. 5 passed' guest.txt
          grep -q 'on the game.s window' guest.txt
