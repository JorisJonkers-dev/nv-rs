# Fork-only. The build, as one job per ENGINE COMPONENT (.fork/components.toml, explained in docs/fork/CI.md).
# Replaces fork-build-linux.yml and fork-build-windows.yml. Called by fork-ci.yml as `build`.
#
# A component job runs `cargo test --locked -p <the component's crates>`, so cargo compiles only that
# component's closure, and nothing else. On a pull request only the components a change reaches run
# (scripts/fork/components.py matrix); on a push to the integration branch, on the schedule and on a manual run
# every component runs. The engine crate's own integration tests are split along the typed families (jobs of the
# component `integration`). Linux jobs marked informational do not fail the run: they find out which components
# also pass on Linux (promote them with .fork/linux-ok.txt).
#
# Parity: every command of upstream's ci.yml is in this file: `cargo fmt --all -- --check` (Format),
# `cargo test --locked --workspace` (every workspace crate is in exactly one component), `cargo clippy --locked
# --workspace --all-targets -- -D warnings` (Clippy), the d3dx-tex software-truncation test and clippy
# (component formats), the ledger and the launcher (component launcher-and-ledger). When a sync changes ci.yml, the
# sync pull request gets the label ci-parity-review: compare it with this file.
# Actions minutes are free on a public repository, so more jobs cost nothing; they would not on a private one.
name: Build

on:
  workflow_call: {}

permissions:
  contents: read

env:
  # Builds once from a cache; incremental state and debug info only cost time. Same as upstream's ci.yml.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  # The differential tests run a case under its second control word only when the first run read or loaded the word
  # (engine-core, typed/diff.rs). The nightly run does not skip: it is the check that the skip loses nothing.
  NV_DIFF_ALL_WORDS: ${{ github.event_name == 'schedule' && '1' || '' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      matrix_archive: ${{ steps.plan.outputs.matrix_archive }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      archive: ${{ steps.plan.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Fails when a workspace crate belongs to no component, a requires list is wrong or a test file is in no job.
          python3 -I scripts/fork/components.py check
          if [ "$EVENT" = pull_request ]; then
            python3 -I scripts/fork/components.py matrix --event pull_request --base "$BASE" --head "$HEAD" >matrix.json
          else
            python3 -I scripts/fork/components.py matrix --event "$EVENT" >matrix.json
          fi
          {
            echo "matrix=$(jq -c '{include: .include_rest}' matrix.json)"
            echo "matrix_archive=$(jq -c '{include: .include_archive}' matrix.json)"
            echo "has_jobs=$(jq '.include_rest | length > 0' matrix.json)"
            echo "archive=$(jq -r '.archive // empty' matrix.json)"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### Components in this run"
            echo
            echo "Reason: $(jq -r .reason matrix.json)"
            echo
            echo "| Component | This run | Jobs |"
            echo "| --- | --- | ---: |"
            jq -r '.components[] | "| \(.component) | \(if .tested then "tested" else "not affected: \(.why)" end) | \(.jobs) |"' matrix.json
            echo
            echo "<details><summary>The component graph (what each job compiles; compile times are estimates)</summary>"
            echo
            python3 -I scripts/fork/components.py graph --timings .fork/test-timings.json
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  # The test binaries of the archived jobs (the typed families), compiled ONCE; the jobs below only run them.
  archive:
    name: Test binaries (Windows)
    needs: plan
    if: ${{ needs.plan.outputs.archive != '' }}
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      ARCHIVE_CMD: ${{ needs.plan.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: integration-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - name: Compile the test binaries once
        run: |
          set -o pipefail
          start=$SECONDS
          bash -c "$ARCHIVE_CMD --no-run --timings --message-format=json-render-diagnostics" | python -I scripts/fork/archive.py build --out "$RUNNER_TEMP/archive"
          echo "Compile and archive $((SECONDS - start)) s: $(du -sm "$RUNNER_TEMP/archive" | cut -f1) MB" | tee -a "$GITHUB_STEP_SUMMARY"
      # The per-test times a previous run recorded (the typed jobs upload them): the shards are packed by them. Best effort:
      # without them the shards take every n-th test.
      - name: Recorded test times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list --workflow Pipeline --status success --limit 8 --json databaseId --jq '.[].databaseId' --repo "$GITHUB_REPOSITORY"); do
            rm -rf "$RUNNER_TEMP/times"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'test-times-*' --dir "$RUNNER_TEMP/times" 2>/dev/null && ls "$RUNNER_TEMP"/times/*/times.json >/dev/null 2>&1; then
              python -I scripts/fork/archive.py merge "$RUNNER_TEMP"/times/*/times.json --out "$RUNNER_TEMP/archive/times.json" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "from run $run" | tee -a "$GITHUB_STEP_SUMMARY"
              break
            fi
          done || true
      - name: Slowest compile units
        run: python -I scripts/fork/archive.py timings --dir target/cargo-timings --top 20 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-archive
          path: ${{ runner.temp }}/archive
          retention-days: 1
          compression-level: 1

  component:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.has_jobs == 'true' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.informational }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PY: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
      # Linux jobs that run in the flake's ci shell.
      IN_NIX: ${{ matrix.os == 'ubuntu-latest' && (matrix.component == 'rendering' || matrix.component == 'platform') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux `rendering` and `platform` run inside the flake's `ci` shell (docs/fork/CI-NIX.md): the one place with a
      # libvkd3d-shader recent enough for HLSL to d3dbc, lavapipe and the compiler, all of one C library.
      - name: Rust toolchain
        if: ${{ env.IN_NIX != '1' }}
        run: rustup toolchain install
      # Only the crates.io dependencies are restored (workspace crates are not cached): worth about 45 s.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.workspaces }}
          shared-key: ${{ matrix.cache }}-${{ runner.os }}${{ env.IN_NIX == '1' && '-nix' || '' }}
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      # The repository only allows GitHub-owned and a few listed actions, so Nix comes from its own installer
      # (single user), as in fork-release-build.yml. Binary cache: cache.nixos.org only (docs/fork/CI-NIX.md).
      - name: Nix and the ci shell
        if: ${{ env.IN_NIX == '1' }}
        run: |
          set -euo pipefail
          start=$SECONDS
          sudo mkdir -m 0755 /nix
          sudo chown "$(id -un)" /nix
          curl --proto '=https' --tlsv1.2 -fsSL https://nixos.org/nix/install | sh -s -- --no-daemon
          mkdir -p ~/.config/nix
          echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          installed=$((SECONDS - start))
          export PATH="$HOME/.nix-profile/bin:$PATH"
          # Realises the shell (compiler, vkd3d, mesa, Vulkan loader) so the test step's time is the tests' own.
          nix develop .#ci --print-build-logs --command bash -c "echo \"libvkd3d-shader: \$NV_VKD3D_SHADER\"; vulkaninfo --summary | grep -E 'deviceName|driverInfo'" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Nix install ${installed} s, ci shell $((SECONDS - start - installed)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test ${{ matrix.component }}
        env:
          SCRIPT: ${{ matrix.script }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$IN_NIX" = 1 ]; then
            nix develop .#ci --command bash scripts/fork/run-component.sh
          else
            bash scripts/fork/run-component.sh
          fi
      - name: Shader compiler tests ran against libvkd3d-shader
        if: ${{ !cancelled() && env.IN_NIX == '1' }}
        run: python3 -I scripts/fork/vkd3d_gate.py "$RUNNER_TEMP/test.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: GPU tests ran on a device
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.component == 'rendering' }}
        run: python3 -I scripts/fork/gpu_gate.py "$RUNNER_TEMP/test.log" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          TITLE: ${{ matrix.name }}
        run: |
          "$PY" -I scripts/fork/libtest_summary.py --title "$TITLE" --timings "$RUNNER_TEMP/timings.txt" "$RUNNER_TEMP/test.log" >>"$GITHUB_STEP_SUMMARY"

  # The archived jobs (the typed families): they run the binaries the `archive` job compiled, in this checkout, with no
  # toolchain, cache restore or compile of their own (scripts/fork/archive.py).
  typed:
    name: ${{ matrix.name }}
    needs: [plan, archive]
    if: ${{ needs.plan.outputs.archive != '' && needs.archive.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_archive) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-archive
          path: ${{ runner.temp }}/archive
      - name: Run ${{ matrix.component }} from the archive
        env:
          TESTS: ${{ matrix.tests }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          : >"$RUNNER_TEMP/test.log"
          python -I scripts/fork/archive.py run --dir "$RUNNER_TEMP/archive" --tests "$TESTS" --shard "$SHARD" --timings "$RUNNER_TEMP/timings.txt" 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      - name: Record test times
        if: ${{ !cancelled() }}
        run: mkdir -p "$RUNNER_TEMP/times" && python -I scripts/fork/archive.py record "$RUNNER_TEMP/test.log" --out "$RUNNER_TEMP/times/times.json" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: test-times-${{ strategy.job-index }}
          path: ${{ runner.temp }}/times/times.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          TITLE: ${{ matrix.name }}
        run: |
          python -I scripts/fork/libtest_summary.py --title "$TITLE" --timings "$RUNNER_TEMP/timings.txt" "$RUNNER_TEMP/test.log" >>"$GITHUB_STEP_SUMMARY"

  clippy:
    name: Clippy (whole workspace)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PY: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: clippy-windows
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - run: |
          rc=0
          # Outside the checkout (nvinspect's hygiene test reads every file git does not ignore).
          cargo clippy --locked --workspace --all-targets --message-format json -- -D warnings >"$RUNNER_TEMP/clippy.json" || rc=$?
          "$PY" -I scripts/fork/clippy_annotations.py "$RUNNER_TEMP/clippy.json"
          exit "$rc"

  # Which crates build on Linux (informational); its candidate list is what .fork/linux-ok.txt is promoted from.
  probe:
    name: Linux probe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: linux-probe
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - run: python3 scripts/fork/linux_probe.py --out "$RUNNER_TEMP/linux-ok.candidate" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ok-candidate
          path: ${{ runner.temp }}/linux-ok.candidate

  # One result for fork-ci.yml: failed when any required job failed (informational Linux jobs cannot fail it).
  done:
    name: Build result
    needs: [plan, fmt, archive, typed, component, clippy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$bad" ]; then echo "::error title=Build::$bad"; exit 1; fi
