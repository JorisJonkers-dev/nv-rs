name: Fork Release build

# Builds release artefacts for Windows and Linux and uploads them as workflow
# artefacts. This workflow NEVER publishes a release: only the maintainer
# decides on a release, and packaging stays local because
# scripts/package-playtest.ps1 needs the player's own copyrighted FalloutNV.exe
# to prove no game bytes are in the programs (so package-check can never run
# here).
#
# Windows: nv-rs-programs-<version>-windows-x64/ laid out like a cargo target
# directory (release/ and i686-pc-windows-msvc/release/) so the maintainer can
# run, locally:
#   scripts/package-playtest.ps1 -Version <version> -Game <FalloutNV.exe> \
#       -UseBuilt -Target <the downloaded folder>
#
# Linux: nv-rs-<version>-linux-x86_64-dev.tar.gz, a developer build. It
# compiles and runs the test suite but cannot play: off Windows there is no
# window, sound or graphics back end yet.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, YYYY-MM-DD.N (for example 2026-11-07.2)'
        required: true
        type: string
  push:
    tags:
      - 'preview-*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate the version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#preview-}"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
            echo "::error::'${version}' is not a YYYY-MM-DD.N version"
            exit 1
          fi
          echo "Building version ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  windows:
    name: Windows x64 programs
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PROGRAMS_DIR: nv-rs-programs-${{ needs.version.outputs.version }}-windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned toolchain and the i686 target
        run: |
          rustup toolchain install
          rustup target add i686-pc-windows-msvc

      # Mirrors scripts/package-playtest.ps1 (its not -UseBuilt branch): one set of flags for every
      # program (static C runtime, build-machine paths remapped), CARGO_TARGET_DIR shared, the
      # 32-bit tools on the same pinned toolchain.
      - name: Build the programs
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          $registry = Join-Path $cargoHome 'registry\src'
          $env:CARGO_ENCODED_RUSTFLAGS = @('-C', 'target-feature=+crt-static', "--remap-path-prefix=$env:GITHUB_WORKSPACE=nv-rs", "--remap-path-prefix=$registry=cargo", "--remap-path-prefix=$rustupHome=rustup") -join [char]0x1f
          cargo build --release --locked -p nv-viewer
          if ($LASTEXITCODE) { throw 'nv-viewer did not build.' }
          foreach ($m in @('launcher', 'd3d9-capture', 'package-check')) {
            cargo build --release --locked --manifest-path "scripts/$m/Cargo.toml"
            if ($LASTEXITCODE) { throw "$m did not build." }
          }
          foreach ($m in @('nvapi-capture', 'dsound-capture')) {
            cargo build --release --locked --target i686-pc-windows-msvc --manifest-path "scripts/$m/Cargo.toml"
            if ($LASTEXITCODE) { throw "$m did not build." }
          }

      - name: Lay the programs out like a cargo target directory
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAMS_DIR
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $dir 'release'), `
            (Join-Path $dir 'i686-pc-windows-msvc/release') | Out-Null

          $layout = [ordered]@{
            'release/nv-viewer.exe'                           = 'target/release/nv-viewer.exe'
            'release/Play.exe'                                = 'target/release/Play.exe'
            'release/d3d9-capture.exe'                        = 'target/release/d3d9-capture.exe'
            'release/package-check.exe'                       = 'target/release/package-check.exe'
            'i686-pc-windows-msvc/release/nvapi-capture.exe'  = 'target/i686-pc-windows-msvc/release/nvapi-capture.exe'
            'i686-pc-windows-msvc/release/dsound-capture.exe' = 'target/i686-pc-windows-msvc/release/dsound-capture.exe'
          }

          foreach ($dest in $layout.Keys) {
            $src = Join-Path $env:GITHUB_WORKSPACE $layout[$dest]
            if (-not (Test-Path -LiteralPath $src)) { throw "missing build output: $src" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $dir $dest)
          }

          Get-ChildItem -Recurse -File -LiteralPath $dir |
            ForEach-Object { $_.FullName.Substring($dir.Length + 1) }

      - name: Write SHA256SUMS
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAMS_DIR
          $lines = Get-ChildItem -Recurse -File -LiteralPath $dir |
            Where-Object { $_.Name -ne 'SHA256SUMS' } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = [System.IO.Path]::GetRelativePath($dir, $_.FullName) -replace '\\', '/'
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $rel"
            }
          Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS') -Value $lines -Encoding utf8NoBOM
          Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS')

      - name: Attest build provenance (optional)
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.PROGRAMS_DIR }}/**/*

      - name: Upload the Windows programs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PROGRAMS_DIR }}
          path: ${{ env.PROGRAMS_DIR }}
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x86_64 developer build
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      STAGE_DIR: nv-rs-${{ needs.version.outputs.version }}-linux-x86_64-dev
      TARBALL: nv-rs-${{ needs.version.outputs.version }}-linux-x86_64-dev.tar.gz
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Build nv-viewer (x86_64-unknown-linux-gnu)
        run: cargo build --release --locked -p nv-viewer

      - name: Stage the developer build
        run: |
          set -euo pipefail
          mkdir -p "${STAGE_DIR}"
          install -m 0755 target/release/nv-viewer "${STAGE_DIR}/nv-viewer"
          cat > "${STAGE_DIR}/README-DEVELOPER-BUILD.txt" <<'EOF'
          nv-rs developer build (Linux x86_64)
          ====================================

          This is NOT a playable build. The game binary only plays on Windows
          today. Off Windows the workspace has cfg(unix) code paths (mmap for
          guest memory) but no window, sound or graphics back end, so this
          binary compiles and runs the test suite but cannot start the game.

          It exists so that the Linux build and the test suite can be exercised
          against a release-profile binary. Do not report gameplay bugs against
          it.

          Contents:
            nv-viewer   release build of the nv-viewer package
          EOF
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "${TARBALL}" "${STAGE_DIR}"
          sha256sum "${TARBALL}" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance (optional)
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ env.TARBALL }}
            SHA256SUMS

      - name: Upload the Linux developer build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nv-rs-${{ env.VERSION }}-linux-x86_64-dev
          path: |
            ${{ env.TARBALL }}
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
