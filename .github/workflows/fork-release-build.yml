name: Release Build

# Builds release artefacts for Windows and Linux and uploads them as workflow
# artefacts. It publishes a GitHub Release only for a release-please tag (the `tag` and `publish`
# inputs, below); a date-version build never publishes. Local packaging remains because
# scripts/package-playtest.ps1 needs the player's own copyrighted FalloutNV.exe
# to prove no game bytes are in the programs (so package-check can never run
# here).
#
# Windows: nv-rs-programs-<version>-windows-x64/ laid out like a cargo target
# directory (release/ and i686-pc-windows-msvc/release/) so the maintainer can
# run, locally:
#   scripts/package-playtest.ps1 -Version <version> -Game <FalloutNV.exe> \
#       -UseBuilt -Target <the downloaded folder>
#
# Linux: nv-rs-linux-x86_64-dev.tar.gz (the name nvmod's install-nv-rs fetches; the version is in the
# folder inside and in release-manifest.json), a developer build with install.sh, a launcher and a desktop
# entry (packaging/linux/, docs/fork/LINUX.md). It checks an installation (nv-viewer --check) but cannot
# play: off Windows there is no window, sound or graphics back end yet. The build smoke-tests the
# tarball it wrote; the `nix` job builds the flake's package and smoke-tests that.
#
# Both builds also carry capabilities.json and release-manifest.json (written by
# scripts/fork/release-files from the command tables and the engine's section
# hashes, validated against .fork/schemas/, docs/fork/RELEASE-FILES.md), listed in
# their SHA256SUMS and covered by their build attestation.
#
# The `package` job (fork-package-windows.yml, docs/fork/WINDOWS.md) turns the Windows programs into a portable ZIP and an
# unsigned installer, smoke tests both on a Windows runner and uploads them with the release files.

# Publishing: release.yml dispatches this workflow with `tag` (the release-please tag, vX.Y.Z) and
# `publish` true when a release is created (a tag made with the default token starts no workflow of its
# own). The sources are the tag's; the packaging scripts (packaging/, scripts/fork/, .fork/) come from the
# workflow's own ref and are laid over them, because a tag can predate them. The `guard` job refuses a tag
# that is not vX.Y.Z on the fork branch at a release-please commit. Then each platform publishes on its own, as
# soon as it is ready: `publish-linux` uploads the Linux tarball (the name nvmod's install-nv-rs fetches),
# SHA256SUMS, release-manifest.json, capabilities.json and the schemas; `publish-windows` (after the Windows
# package) uploads the ZIP, the installer and SHA256SUMS-windows. Each attests its own assets.
# `tag` without `publish` is a dry run that builds and attests nothing to the release.
#
# Packages: after both publish jobs the `packages` job pushes the same builds as OCI packages to
# ghcr.io/jorisjonkers-dev/nv-rs:<version>-<target> (ADR-0017 of the Toolbox; docs/fork/RELEASE-FILES.md), from the
# artefacts already built here (nothing is built twice). fork-packages-dry-run.yml is the pull request dry run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, YYYY-MM-DD.N (for example 2026-11-07.2); ignored when tag is set'
        required: false
        type: string
      tag:
        description: 'A release-please tag, vX.Y.Z, to build (instead of a date version)'
        required: false
        type: string
      publish:
        description: 'Upload the assets to the release for tag (false is a dry run)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'preview-*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate the version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            printf '%s' "${INPUT_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::'${INPUT_TAG}' is not vX.Y.Z"; exit 1; }
            echo "version=${INPUT_TAG#v}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#preview-}"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
            echo "::error::'${version}' is not a YYYY-MM-DD.N version"
            exit 1
          fi
          echo "Building version ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  guard:
    name: Publish guard
    needs: version
    if: ${{ inputs.publish && inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the fork branch with its tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Publishing is for release-please tags only
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = refs/heads/fork ] || { echo "::error::publish runs from the fork branch only, not ${GITHUB_REF}"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG" refs/remotes/origin/fork || { echo "::error::$TAG is not on the fork branch"; exit 1; }
          subject="$(git log -1 --format=%s "refs/tags/$TAG")"
          [[ "$subject" =~ ^chore\([a-z-]+\):\ release\ ${TAG#v}\  ]] || { echo "::error::$TAG is not a release-please commit: $subject"; exit 1; }

  release-files:
    name: Capabilities and release manifest
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          # The upstream base commit is a trailer of an earlier commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the packaging scripts of this ref (a release tag can predate them)
        if: ${{ inputs.tag != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false

      - name: Lay the packaging scripts over the tag's sources
        if: ${{ inputs.tag != '' }}
        run: |
          set -euo pipefail
          mkdir -p scripts/fork
          cp -a tooling/scripts/fork/. scripts/fork/
          cp -a tooling/.fork .
          [ ! -d tooling/packaging ] || cp -a tooling/packaging .
          rm -rf tooling

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Write the two files and validate them against the schemas
        run: |
          set -euo pipefail
          # The last upstream commit the fork line was replayed to (as scripts/fork/verify-sync.sh finds it); before the
          # first replay the merge base with the upstream copy is not available here, so a missing trailer is an error.
          base="$(git log -1 --format=%B --grep='^Upstream-Commit: [0-9a-f]\{40\}$' HEAD | sed -n 's/^Upstream-Commit: \([0-9a-f]\{40\}\)$/\1/p' | tail -n 1)"
          [ -n "${base}" ] || { echo "::error::no Upstream-Commit trailer in the history"; exit 1; }
          tool=(cargo run --locked --quiet --manifest-path scripts/fork/release-files/Cargo.toml --)
          mkdir -p release-files
          "${tool[@]}" capabilities --out release-files/capabilities.json
          "${tool[@]}" manifest --version "${VERSION}" --upstream-base "${base}" \
            --source-commit "$(git rev-parse HEAD)" --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --out release-files/release-manifest.json
          "${tool[@]}" validate --schema .fork/schemas/nv-rs-capabilities.v1.json release-files/capabilities.json
          "${tool[@]}" validate --schema .fork/schemas/nv-rs-release-manifest.v1.json release-files/release-manifest.json
          # The checked-in copy is the tables' too: a release from a tree where they disagree is refused.
          # A tag's tables can differ from the checked-in file of this ref; the file is generated from the tag's own.
          if [ -z "${RELEASE_TAG}" ]; then "${tool[@]}" capabilities --check .fork/capabilities.json; fi
          # The schemas are published next to the binaries so nvmod can vendor them.
          cp .fork/schemas/*.json release-files/
          cat release-files/release-manifest.json

      - name: Upload the files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nv-rs-${{ env.VERSION }}-release-files
          path: release-files
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 programs
    needs: [version, release-files]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PROGRAMS_DIR: nv-rs-programs-${{ needs.version.outputs.version }}-windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - name: Install the pinned toolchain and the i686 target
        run: |
          rustup toolchain install
          rustup target add i686-pc-windows-msvc

      # Mirrors scripts/package-playtest.ps1 (its not -UseBuilt branch): one set of flags for every
      # program (static C runtime, build-machine paths remapped), CARGO_TARGET_DIR shared, the
      # 32-bit tools on the same pinned toolchain.
      - name: Build the programs
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          $registry = Join-Path $cargoHome 'registry\src'
          $env:CARGO_ENCODED_RUSTFLAGS = @('-C', 'target-feature=+crt-static', "--remap-path-prefix=$env:GITHUB_WORKSPACE=nv-rs", "--remap-path-prefix=$registry=cargo", "--remap-path-prefix=$rustupHome=rustup") -join [char]0x1f
          cargo build --release --locked -p nv-viewer
          if ($LASTEXITCODE) { throw 'nv-viewer did not build.' }
          foreach ($m in @('launcher', 'd3d9-capture', 'package-check')) {
            cargo build --release --locked --manifest-path "scripts/$m/Cargo.toml"
            if ($LASTEXITCODE) { throw "$m did not build." }
          }
          foreach ($m in @('nvapi-capture', 'dsound-capture')) {
            cargo build --release --locked --target i686-pc-windows-msvc --manifest-path "scripts/$m/Cargo.toml"
            if ($LASTEXITCODE) { throw "$m did not build." }
          }

      - name: Lay the programs out like a cargo target directory
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAMS_DIR
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $dir 'release'), `
            (Join-Path $dir 'i686-pc-windows-msvc/release') | Out-Null

          $layout = [ordered]@{
            'release/nv-viewer.exe'                           = 'target/release/nv-viewer.exe'
            'release/Play.exe'                                = 'target/release/Play.exe'
            'release/d3d9-capture.exe'                        = 'target/release/d3d9-capture.exe'
            'release/package-check.exe'                       = 'target/release/package-check.exe'
            'i686-pc-windows-msvc/release/nvapi-capture.exe'  = 'target/i686-pc-windows-msvc/release/nvapi-capture.exe'
            'i686-pc-windows-msvc/release/dsound-capture.exe' = 'target/i686-pc-windows-msvc/release/dsound-capture.exe'
          }

          foreach ($dest in $layout.Keys) {
            $src = Join-Path $env:GITHUB_WORKSPACE $layout[$dest]
            if (-not (Test-Path -LiteralPath $src)) { throw "missing build output: $src" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $dir $dest)
          }

          Get-ChildItem -Recurse -File -LiteralPath $dir |
            ForEach-Object { $_.FullName.Substring($dir.Length + 1) }

      - name: Add capabilities.json, release-manifest.json and the schemas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nv-rs-${{ needs.version.outputs.version }}-release-files
          path: ${{ env.PROGRAMS_DIR }}

      - name: Write SHA256SUMS
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAMS_DIR
          $lines = Get-ChildItem -Recurse -File -LiteralPath $dir |
            Where-Object { $_.Name -ne 'SHA256SUMS' } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = [System.IO.Path]::GetRelativePath($dir, $_.FullName) -replace '\\', '/'
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $rel"
            }
          Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS') -Value $lines -Encoding utf8NoBOM
          Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS')

      - name: Attest build provenance (optional)
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.PROGRAMS_DIR }}/**/*

      - name: Upload the Windows programs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PROGRAMS_DIR }}
          path: ${{ env.PROGRAMS_DIR }}
          if-no-files-found: error
          retention-days: 30

  package:
    name: Windows package
    needs: [version, release-files, windows]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/fork-package-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      programs-artifact: nv-rs-programs-${{ needs.version.outputs.version }}-windows-x64
      release-files-artifact: nv-rs-${{ needs.version.outputs.version }}-release-files

  linux:
    name: Linux x86_64 developer build
    needs: [version, release-files]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARBALL: nv-rs-linux-x86_64-dev.tar.gz
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - name: Check out the packaging scripts of this ref (a release tag can predate them)
        if: ${{ inputs.tag != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false

      - name: Lay the packaging scripts over the tag's sources
        if: ${{ inputs.tag != '' }}
        run: |
          set -euo pipefail
          mkdir -p scripts/fork
          cp -a tooling/scripts/fork/. scripts/fork/
          cp -a tooling/.fork .
          [ ! -d tooling/packaging ] || cp -a tooling/packaging .
          rm -rf tooling

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Build nv-viewer (x86_64-unknown-linux-gnu)
        run: cargo build --release --locked -p nv-viewer

      - name: Add capabilities.json, release-manifest.json and the schemas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nv-rs-${{ needs.version.outputs.version }}-release-files
          path: release-files

      # packaging/linux/package.sh lays the tree out (bin/, share/applications, share/icons, share/nv-rs/*.json, install.sh)
      # and writes nv-rs-linux-x86_64-dev.tar.gz: the name nvmod's install-nv-rs fetches, with SHA256SUMS beside it.
      - name: Stage the tarball
        run: |
          set -euo pipefail
          packaging/linux/package.sh target/release/nv-viewer "${VERSION}" dist release-files
          cp dist/"${TARBALL}" release-files/*.json .

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum "${TARBALL}" capabilities.json release-manifest.json nv-rs-*.v*.json > SHA256SUMS
          cat SHA256SUMS

      # The smoke test runs the artifact as a person gets it: checksum verified, tarball unpacked into an empty folder,
      # then nv-viewer --check on folders that are not a game. No game data is needed or read.
      - name: Smoke test the built tarball
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          mkdir "${RUNNER_TEMP}/unpacked"
          tar -xzf "${TARBALL}" -C "${RUNNER_TEMP}/unpacked"
          packaging/linux/smoke-test.sh "${RUNNER_TEMP}/unpacked/nv-rs-${VERSION}-linux-x86_64"
          "${RUNNER_TEMP}/unpacked/nv-rs-${VERSION}-linux-x86_64/install.sh" --prefix "${RUNNER_TEMP}/prefix"
          packaging/linux/smoke-test.sh "${RUNNER_TEMP}/prefix"

      - name: Attest build provenance (optional)
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ env.TARBALL }}
            capabilities.json
            release-manifest.json
            nv-rs-*.v*.json
            SHA256SUMS

      - name: Upload the Linux developer build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nv-rs-${{ env.VERSION }}-linux-x86_64-dev
          path: |
            ${{ env.TARBALL }}
            capabilities.json
            release-manifest.json
            nv-rs-*.v*.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # The same program as a Nix package (flake.nix), built and run through `nix flake check`'s smoke check.
  nix:
    name: Nix package
    if: ${{ inputs.tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The repository only allows GitHub-owned and a few listed actions, so Nix comes from its own installer (single user).
      - name: Install Nix
        run: |
          set -euo pipefail
          sudo mkdir -m 0755 /nix
          sudo chown "$(id -un)" /nix
          curl --proto '=https' --tlsv1.2 -fsSL https://nixos.org/nix/install | sh -s -- --no-daemon
          mkdir -p ~/.config/nix
          echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build the package
        run: nix build --print-build-logs --no-link --print-out-paths .#nv-viewer

      - name: Smoke test the package (nv-viewer --check on folders that are not a game)
        run: nix build --print-build-logs --no-link .#checks.x86_64-linux.smoke

  # Each platform publishes as soon as its own build is done: Linux never waits for Windows. Both jobs upload to
  # the release release-please already created (neither creates it), with `gh release upload --clobber`, so a
  # re-run is harmless, and share one concurrency group per tag so their uploads never overlap. The asset names
  # do not collide: Linux owns SHA256SUMS (the name nvmod's install-nv-rs reads), Windows owns SHA256SUMS-windows.
  # capabilities.json, release-manifest.json and the schemas are the same files in both (one `release-files` job
  # makes them) and Linux uploads them; the manifest has no per-platform asset list, so a Linux-only moment of the release is complete.
  publish-linux:
    name: Publish the Linux release assets
    needs: [version, guard, linux]
    if: ${{ inputs.publish && inputs.tag != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-upload-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write # upload the assets to the release
      id-token: write # the attestation is signed with the workflow's OIDC identity
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download the Linux build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nv-rs-${{ env.VERSION }}-linux-x86_64-dev
          path: dist

      - name: Verify the checksums
        run: |
          set -euo pipefail
          ( cd dist && sha256sum --check SHA256SUMS && ls -l )

      - name: Attest build provenance of the release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Upload to the release
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" > /dev/null
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber

  publish-windows:
    name: Publish the Windows release assets
    needs: [version, guard, package]
    if: ${{ inputs.publish && inputs.tag != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-upload-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download the Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nv-rs-${{ env.VERSION }}-windows-x64-package
          path: windows

      - name: Gather the Windows assets
        run: |
          set -euo pipefail
          ( cd windows && sha256sum --check SHA256SUMS )
          mkdir dist
          cp windows/nv-rs-preview-*.zip windows/nv-rs-setup-*.exe dist/
          # Its own name, so it cannot overwrite the Linux SHA256SUMS; lists the ZIP, installer and the shared files.
          cp windows/SHA256SUMS dist/SHA256SUMS-windows
          ls -l dist

      - name: Attest build provenance of the release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Upload to the release
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" > /dev/null
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber

  # The engine builds of this release as OCI packages on ghcr.io (Toolbox ADR-0017): one package named after the
  # repository, one tag per target, <version>-<target>. Fork-only (docs/fork/DIVERGENCE.md). The archives are made from
  # the artefacts of the `linux` and `package` jobs, so nothing is built a second time. oras comes from its release with a
  # checked SHA-256 (the repository allows only listed actions). Re-running with the tag republishes it.
  packages:
    name: Publish the OCI packages
    needs: [version, publish-linux, publish-windows]
    if: ${{ inputs.publish && inputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-packages-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write # append the package table to the release notes
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT: packages
    steps:
      - name: Check out the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download the Linux build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nv-rs-${{ env.VERSION }}-linux-x86_64-dev
          path: linux

      - name: Download the Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nv-rs-${{ env.VERSION }}-windows-x64-package
          path: windows

      - name: Install oras
        run: |
          set -euo pipefail
          curl -fsSLo oras.tar.gz https://github.com/oras-project/oras/releases/download/v1.4.0/oras_1.4.0_linux_amd64.tar.gz
          echo "d8e1dce2fd8ce996f1d901845b688eb0cf505a6082897606f053825bb47935d1  oras.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oras"
          tar -xzf oras.tar.gz -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
          rm oras.tar.gz

      # Linux: the developer build's tree with LICENSE added. Windows: the portable ZIP, which already carries LICENSE.
      - name: Build the archives
        run: |
          set -euo pipefail
          ( cd linux && sha256sum --check SHA256SUMS )
          mkdir -p "$OUT" unpack
          tar -xzf linux/nv-rs-linux-x86_64-dev.tar.gz -C unpack
          cp LICENSE "unpack/nv-rs-${VERSION}-linux-x86_64/"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2000-01-01 00:00Z' -C unpack \
            -czf "$OUT/nv-rs-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" "nv-rs-${VERSION}-linux-x86_64"
          cp "windows/nv-rs-preview-${VERSION}-windows-x64.zip" "$OUT/nv-rs-${VERSION}-x86_64-pc-windows-msvc.zip"
          unzip -l "$OUT/nv-rs-${VERSION}-x86_64-pc-windows-msvc.zip" | grep LICENSE >/dev/null
          tar -tzf "$OUT/nv-rs-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | grep 'LICENSE$' >/dev/null
          ls -l "$OUT"

      - name: Push the packages
        id: push
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # The commit the tag points at (the job checked the tag out).
          REVISION="$(git rev-parse HEAD)"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          push_one() {
            local target="$1" archive="$2"
            local ref="ghcr.io/jorisjonkers-dev/nv-rs:${VERSION}-${target}"
            (cd "$OUT" && oras push "$ref" "$(basename "$archive")" \
              --annotation "org.opencontainers.image.source=https://github.com/JorisJonkers-dev/nv-rs" \
              --annotation "org.opencontainers.image.revision=${REVISION}" \
              --annotation "org.opencontainers.image.licenses=GPL-3.0-only")
            oras resolve "$ref" | tr -d '\n' > "$OUT/${target}.digest"
            sha256sum "$archive" | awk '{print $1}' > "$OUT/${target}.sha256"
            echo "pushed $ref $(cat "$OUT/${target}.digest")"
          }
          push_one x86_64-unknown-linux-gnu "$OUT/nv-rs-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          push_one x86_64-pc-windows-msvc "$OUT/nv-rs-${VERSION}-x86_64-pc-windows-msvc.zip"
          {
            echo "digest_linux=$(cat "$OUT/x86_64-unknown-linux-gnu.digest")"
            echo "digest_windows=$(cat "$OUT/x86_64-pc-windows-msvc.digest")"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the Linux package
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/nv-rs
          subject-digest: ${{ steps.push.outputs.digest_linux }}
          push-to-registry: true

      - name: Attest the Windows package
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/jorisjonkers-dev/nv-rs
          subject-digest: ${{ steps.push.outputs.digest_windows }}
          push-to-registry: true

      # The attestations pushed with the login of the push step; the pull below is anonymous.
      - name: Log out of the registry
        run: oras logout ghcr.io

      # A first push of a package is private until the owner makes it public once; set the variable then to skip this.
      - name: Verify the packages are public
        if: ${{ vars.NV_RS_FIRST_PACKAGE_PUSH != 'true' }}
        run: |
          set -euo pipefail
          check() {
            local target="$1" archive="$2"
            local digest sha pulled
            digest="$(cat "$OUT/${target}.digest")"
            sha="$(cat "$OUT/${target}.sha256")"
            rm -rf "$OUT/pull-${target}"
            mkdir -p "$OUT/pull-${target}"
            oras pull "ghcr.io/jorisjonkers-dev/nv-rs@${digest}" -o "$OUT/pull-${target}"
            pulled="$(sha256sum "$OUT/pull-${target}/$(basename "$archive")" | awk '{print $1}')"
            echo "$target: pulled $pulled (expected $sha)"
            test "$pulled" = "$sha"
          }
          check x86_64-unknown-linux-gnu "$OUT/nv-rs-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          check x86_64-pc-windows-msvc "$OUT/nv-rs-${VERSION}-x86_64-pc-windows-msvc.zip"

      - name: Record the package references
        run: |
          set -euo pipefail
          summary="$(mktemp)"
          {
            echo "## OCI packages"
            echo
            echo "| Name | Tag | Digest | Archive SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
              echo "| ghcr.io/jorisjonkers-dev/nv-rs | ${VERSION}-${target} | $(cat "$OUT/${target}.digest") | $(cat "$OUT/${target}.sha256") |"
            done
          } > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          notes="$(mktemp)"
          # A republish replaces the earlier table instead of adding a second one.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | sed '/^## Packages$/,$d' > "$notes"
          printf '\n## Packages\n\n' >> "$notes"
          cat "$summary" >> "$notes"
          gh release edit "$TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
