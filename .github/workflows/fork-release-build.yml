name: Release Build

# Builds release artefacts for Windows and Linux and uploads them as workflow
# artefacts. This workflow NEVER publishes a release: only the maintainer
# decides on a release, and packaging stays local because
# scripts/package-playtest.ps1 needs the player's own copyrighted FalloutNV.exe
# to prove no game bytes are in the programs (so package-check can never run
# here).
#
# Windows: nv-rs-programs-<version>-windows-x64/ laid out like a cargo target
# directory (release/ and i686-pc-windows-msvc/release/) so the maintainer can
# run, locally:
#   scripts/package-playtest.ps1 -Version <version> -Game <FalloutNV.exe> \
#       -UseBuilt -Target <the downloaded folder>
#
# Linux: nv-rs-linux-x86_64-dev.tar.gz (the name nvmod's install-nv-rs fetches; the version is in the
# folder inside and in release-manifest.json), a developer build with install.sh, a launcher and a desktop
# entry (packaging/linux/, docs/fork/LINUX.md). It checks an installation (nv-viewer --check) but cannot
# play: off Windows there is no window, sound or graphics back end yet. The build smoke-tests the
# tarball it wrote; the `nix` job builds the flake's package and smoke-tests that.
#
# Both builds also carry capabilities.json and release-manifest.json (written by
# scripts/fork/release-files from the command tables and the engine's section
# hashes, validated against .fork/schemas/, docs/fork/RELEASE-FILES.md), listed in
# their SHA256SUMS and covered by their build attestation.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, YYYY-MM-DD.N (for example 2026-11-07.2)'
        required: true
        type: string
  push:
    tags:
      - 'preview-*'

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate the version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#preview-}"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'; then
            echo "::error::'${version}' is not a YYYY-MM-DD.N version"
            exit 1
          fi
          echo "Building version ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  release-files:
    name: Capabilities and release manifest
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The upstream base commit is a trailer of an earlier commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Write the two files and validate them against the schemas
        run: |
          set -euo pipefail
          # The last upstream commit the fork line was replayed to (as scripts/fork/verify-sync.sh finds it); before the
          # first replay the merge base with the upstream copy is not available here, so a missing trailer is an error.
          base="$(git log -1 --format=%B --grep='^Upstream-Commit: [0-9a-f]\{40\}$' HEAD | sed -n 's/^Upstream-Commit: \([0-9a-f]\{40\}\)$/\1/p' | tail -n 1)"
          [ -n "${base}" ] || { echo "::error::no Upstream-Commit trailer in the history"; exit 1; }
          tool=(cargo run --locked --quiet --manifest-path scripts/fork/release-files/Cargo.toml --)
          mkdir -p release-files
          "${tool[@]}" capabilities --out release-files/capabilities.json
          "${tool[@]}" manifest --version "${VERSION}" --upstream-base "${base}" \
            --source-commit "$(git rev-parse HEAD)" --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --out release-files/release-manifest.json
          "${tool[@]}" validate --schema .fork/schemas/nv-rs-capabilities.v1.json release-files/capabilities.json
          "${tool[@]}" validate --schema .fork/schemas/nv-rs-release-manifest.v1.json release-files/release-manifest.json
          # The checked-in copy is the tables' too: a release from a tree where they disagree is refused.
          "${tool[@]}" capabilities --check .fork/capabilities.json
          # The schemas are published next to the binaries so nvmod can vendor them.
          cp .fork/schemas/*.json release-files/
          cat release-files/release-manifest.json

      - name: Upload the files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nv-rs-${{ env.VERSION }}-release-files
          path: release-files
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 programs
    needs: [version, release-files]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PROGRAMS_DIR: nv-rs-programs-${{ needs.version.outputs.version }}-windows-x64
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned toolchain and the i686 target
        run: |
          rustup toolchain install
          rustup target add i686-pc-windows-msvc

      # Mirrors scripts/package-playtest.ps1 (its not -UseBuilt branch): one set of flags for every
      # program (static C runtime, build-machine paths remapped), CARGO_TARGET_DIR shared, the
      # 32-bit tools on the same pinned toolchain.
      - name: Build the programs
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE '.rustup' }
          $registry = Join-Path $cargoHome 'registry\src'
          $env:CARGO_ENCODED_RUSTFLAGS = @('-C', 'target-feature=+crt-static', "--remap-path-prefix=$env:GITHUB_WORKSPACE=nv-rs", "--remap-path-prefix=$registry=cargo", "--remap-path-prefix=$rustupHome=rustup") -join [char]0x1f
          cargo build --release --locked -p nv-viewer
          if ($LASTEXITCODE) { throw 'nv-viewer did not build.' }
          foreach ($m in @('launcher', 'd3d9-capture', 'package-check')) {
            cargo build --release --locked --manifest-path "scripts/$m/Cargo.toml"
            if ($LASTEXITCODE) { throw "$m did not build." }
          }
          foreach ($m in @('nvapi-capture', 'dsound-capture')) {
            cargo build --release --locked --target i686-pc-windows-msvc --manifest-path "scripts/$m/Cargo.toml"
            if ($LASTEXITCODE) { throw "$m did not build." }
          }

      - name: Lay the programs out like a cargo target directory
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAMS_DIR
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $dir 'release'), `
            (Join-Path $dir 'i686-pc-windows-msvc/release') | Out-Null

          $layout = [ordered]@{
            'release/nv-viewer.exe'                           = 'target/release/nv-viewer.exe'
            'release/Play.exe'                                = 'target/release/Play.exe'
            'release/d3d9-capture.exe'                        = 'target/release/d3d9-capture.exe'
            'release/package-check.exe'                       = 'target/release/package-check.exe'
            'i686-pc-windows-msvc/release/nvapi-capture.exe'  = 'target/i686-pc-windows-msvc/release/nvapi-capture.exe'
            'i686-pc-windows-msvc/release/dsound-capture.exe' = 'target/i686-pc-windows-msvc/release/dsound-capture.exe'
          }

          foreach ($dest in $layout.Keys) {
            $src = Join-Path $env:GITHUB_WORKSPACE $layout[$dest]
            if (-not (Test-Path -LiteralPath $src)) { throw "missing build output: $src" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $dir $dest)
          }

          Get-ChildItem -Recurse -File -LiteralPath $dir |
            ForEach-Object { $_.FullName.Substring($dir.Length + 1) }

      - name: Add capabilities.json, release-manifest.json and the schemas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nv-rs-${{ needs.version.outputs.version }}-release-files
          path: ${{ env.PROGRAMS_DIR }}

      - name: Write SHA256SUMS
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE $env:PROGRAMS_DIR
          $lines = Get-ChildItem -Recurse -File -LiteralPath $dir |
            Where-Object { $_.Name -ne 'SHA256SUMS' } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = [System.IO.Path]::GetRelativePath($dir, $_.FullName) -replace '\\', '/'
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $rel"
            }
          Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS') -Value $lines -Encoding utf8NoBOM
          Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS')

      - name: Attest build provenance (optional)
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ env.PROGRAMS_DIR }}/**/*

      - name: Upload the Windows programs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PROGRAMS_DIR }}
          path: ${{ env.PROGRAMS_DIR }}
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux x86_64 developer build
    needs: [version, release-files]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARBALL: nv-rs-linux-x86_64-dev.tar.gz
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Build nv-viewer (x86_64-unknown-linux-gnu)
        run: cargo build --release --locked -p nv-viewer

      - name: Add capabilities.json, release-manifest.json and the schemas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nv-rs-${{ needs.version.outputs.version }}-release-files
          path: release-files

      # packaging/linux/package.sh lays the tree out (bin/, share/applications, share/icons, share/nv-rs/*.json, install.sh)
      # and writes nv-rs-linux-x86_64-dev.tar.gz: the name nvmod's install-nv-rs fetches, with SHA256SUMS beside it.
      - name: Stage the tarball
        run: |
          set -euo pipefail
          packaging/linux/package.sh target/release/nv-viewer "${VERSION}" dist release-files
          cp dist/"${TARBALL}" release-files/*.json .

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          sha256sum "${TARBALL}" capabilities.json release-manifest.json nv-rs-*.v*.json > SHA256SUMS
          cat SHA256SUMS

      # The smoke test runs the artifact as a person gets it: checksum verified, tarball unpacked into an empty folder,
      # then nv-viewer --check on folders that are not a game. No game data is needed or read.
      - name: Smoke test the built tarball
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          mkdir "${RUNNER_TEMP}/unpacked"
          tar -xzf "${TARBALL}" -C "${RUNNER_TEMP}/unpacked"
          packaging/linux/smoke-test.sh "${RUNNER_TEMP}/unpacked/nv-rs-${VERSION}-linux-x86_64"
          "${RUNNER_TEMP}/unpacked/nv-rs-${VERSION}-linux-x86_64/install.sh" --prefix "${RUNNER_TEMP}/prefix"
          packaging/linux/smoke-test.sh "${RUNNER_TEMP}/prefix"

      - name: Attest build provenance (optional)
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ env.TARBALL }}
            capabilities.json
            release-manifest.json
            nv-rs-*.v*.json
            SHA256SUMS

      - name: Upload the Linux developer build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nv-rs-${{ env.VERSION }}-linux-x86_64-dev
          path: |
            ${{ env.TARBALL }}
            capabilities.json
            release-manifest.json
            nv-rs-*.v*.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # The same program as a Nix package (flake.nix), built and run through `nix flake check`'s smoke check.
  nix:
    name: Nix package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1

      - name: Build the package
        run: nix build --print-build-logs --no-link --print-out-paths .#nv-viewer

      - name: Smoke test the package (nv-viewer --check on folders that are not a game)
        run: nix build --print-build-logs --no-link .#checks.x86_64-linux.smoke
