# Fork-only (JorisJonkers-dev/nv-rs). One pipeline ending in "Pipeline Complete", the only required
# check (estate convention). The build is one job per engine component (fork-build.yml, .fork/components.toml,
# docs/fork/CI.md); the repository's own checks run in parallel with it; Pipeline Complete gathers every result
# and prints each component's result and duration. The two reusable workflows (hygiene, PR title) are jobs.
# Upstream's own gate, .github/workflows/ci.yml (Windows, ~140 minutes), is not required here.
name: Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [fork]
  workflow_dispatch:
  # Every component, also the slow integration tests: a pull request runs only what its change reaches.
  schedule:
    - cron: '17 3 * * *'

# A new commit on a branch cancels the run still going for the older one: runners are limited and the older
# result is of no use. Not cancelled: a title edit (its own group, so it neither cancels nor is cancelled by a
# push; no label events trigger this workflow, so a bot labelling a new pull request starts nothing) and the fork
# branch (every commit there runs to the end, so it always has a finished run and its caches are saved).
concurrency:
  group: pipeline-${{ github.ref == 'refs/heads/fork' && github.sha || format('{0}-{1}', github.event.pull_request.number || github.ref, github.event.action == 'edited' && github.run_id || 'commits') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/fork' }}

permissions:
  contents: read

jobs:
  # Pull requests that only change documentation or the fork's own files skip the builds (see the diff step). The gate below still runs and still requires everything else.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A push to the fork branch always runs the builds: it verifies the result and fills the caches.
          if [ "$EVENT" = push ] || [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            { echo "code=true"; echo "native=true"; } >>"$GITHUB_OUTPUT"; echo "building (push, or no base to compare with)"; exit 0
          fi
          # On a pull request the Rust builds verify UPSTREAM's code. A change that only touches documentation or the fork's own
          # files (.fork/overlay-paths) cannot change that, so the builds are skipped. Files that steer the builds still count.
          BASE="$BASE" HEAD="$HEAD" python3 -I -c '
          import os, re, subprocess
          def diff(flt):
              out = subprocess.run(["git", "diff", "--name-only", "--diff-filter=" + flt, os.environ["BASE"] + "..." + os.environ["HEAD"]],
                                   capture_output=True, text=True, check=True).stdout
              return [f for f in out.splitlines() if f]
          overlay = [l.split("#")[0].strip() for l in open(".fork/overlay-paths", encoding="utf-8")]
          overlay = [o for o in overlay if o]
          # Files that steer the builds count when they are MODIFIED (an existing, verified behaviour changes); a newly added
          # file cannot change what an earlier run verified, and the push to the fork branch runs the full builds anyway.
          steering = re.compile(r"^(\.fork/(linux-ok\.txt|components\.toml)|\.github/workflows/fork-build\.yml|scripts/fork/(linux_probe|components|libtest_summary|clippy_annotations)\.py|scripts/fork/run-component\.sh)$")
          docs = re.compile(r"^(docs/|LICENSE$|.*\.md$)")
          fork_owned = lambda f: any(f == o or (o.endswith("/") and f.startswith(o)) for o in overlay)
          code = [f for f in diff("ACDMRT") if not (docs.match(f) or fork_owned(f))]
          code += [f for f in diff("MDR") if steering.match(f)]
          print("code files:", ", ".join(code[:10]) or "none", file=__import__("sys").stderr)
          print("code=" + ("true" if code else "false"))
          # The macOS job also checks fork-owned crates (fork-window, the facade): it runs unless only documentation changed.
          native = [f for f in diff("ACDMRT") if not docs.match(f)]
          print("native=" + ("true" if native else "false"))
          ' >>"$GITHUB_OUTPUT"

  hygiene:
    name: Hygiene
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3

  pr-title:
    name: PR title
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/pr-title-check.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3

  # Upstream's ci.yml, as one job per engine component (.fork/components.toml); see fork-build.yml.
  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/fork-build.yml

  # The repository's own checks, in parallel with the builds. Separate steps so one failing check does not hide
  # the others.
  lint:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true
          # A pull request's merge ref would write its own 97 MB copy of the same cache.
          cache_save: ${{ github.ref == 'refs/heads/fork' }}

      - name: Workflows
        run: mise exec -- task lint:actions
      - name: Dependencies
        if: ${{ !cancelled() }}
        run: mise exec -- task deny
      - name: Script self-tests
        if: ${{ !cancelled() }}
        run: mise exec -- task scripts
      - name: Secrets
        if: ${{ !cancelled() }}
        run: mise exec -- task secrets

  # The crates a program that links the engine depends on (docs/fork/CONSUMING.md), each built alone, as the Toolbox's raul
  # builds them. Runs on every pull request and push to fork: the crates are fork-owned, so the `changes` filter would skip them.
  facade:
    name: Facade crates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: facade-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - name: fork-api
        run: cargo check --locked -p fork-api
      - name: fork-api with the engine
        if: ${{ !cancelled() }}
        run: cargo check --locked -p fork-api --features engine
      - name: fork-play
        if: ${{ !cancelled() }}
        run: cargo check --locked -p fork-play

  # The engine on macOS (Apple silicon, wgpu on Metal; nv-rs#378): the crates the Toolbox links and the window and
  # device layers build, and their tests that need no game run. The game's window on macOS is nv-rs#379; until then
  # the device layer stays off screen there. Skipped when only documentation changed.
  macos:
    name: macOS
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: never
      # Apple silicon runners have 7 GB of memory: two compilers at a time.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - name: The window and device layers and the platform layer
        run: cargo build --locked -p fork-window -p d3d9-wgpu -p engine-platform
      - name: fork-api with the engine
        if: ${{ !cancelled() }}
        run: cargo check --locked -p fork-api --features engine
      - name: fork-play
        if: ${{ !cancelled() }}
        run: cargo check --locked -p fork-play
      - name: Tests that need no game
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p fork-window -p d3d9-wgpu -p engine-platform

  # Coverage of the components the change reaches, and the changed-line coverage gate of the fork-owned crates
  # (fork-coverage.yml, docs/fork/COVERAGE.md). Pull requests only; the nightly baseline is that workflow's own schedule.
  coverage:
    name: Coverage
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/fork-coverage.yml

  # Upstream-owned files may differ from upstream only where .fork/allowed-divergence says so. Cheap, so it runs on every
  # pull request and push, also when the builds are skipped; it needs the history and upstream's copy (main).
  verify-sync:
    name: Verify sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main (the upstream copy)
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: No divergence outside the overlay
        run: scripts/fork/verify-sync.sh
      # A pull request that replays upstream commits ends its description with the newest Upstream-Commit trailer, so a
      # squash merge (its message is the description) keeps the replay point (scripts/fork/sync_trailer.py). Runs on
      # description edits too (the `edited` trigger).
      - name: The replay point survives the merge
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BODY" >"$RUNNER_TEMP/pr-body.md"
          python3 -I scripts/fork/sync_trailer.py "$BASE" "$HEAD" "$RUNNER_TEMP/pr-body.md"

  # A change to a layout constant of engine-core's mem.rs (the heap's ranges, the platform area, the extenders' code and
  # the helper area) must pass the window test before it merges (nv-rs#272, scripts/fork/layout_gate.py): the heap's
  # tests at lowered windows state the ranges' sizes, so a moved constant fails them. Cheap when nothing moved.
  layout-window:
    name: Layout window test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did a layout constant change
        id: layout
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I scripts/fork/layout_gate.py check --base "${BASE:-HEAD^}" --head "$HEAD" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The window test
        if: ${{ steps.layout.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          rustup toolchain install
          cargo test --locked -p engine-core --lib -- mem::heap::tests::

  # The progress pictures' generator (docs/fork/PROGRESS.md, scripts/fork/progress) in check mode on every pull request,
  # so it cannot break unseen: its tests, two counts of the merged tree that must agree, and the counts against the base's
  # summary. A count that goes down fails unless the description has a line `Progress-Drop: <reason>` (the `edited`
  # trigger runs it again; the upstream replay's drops are only reported). Its report is in the run summary. The pictures themselves are committed after the merge
  # (fork-progress.yml).
  progress:
    name: Progress counts
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the counts
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          rustup toolchain install
          export CARGO_TARGET_DIR="$RUNNER_TEMP/progress-target"
          cargo test --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml
          cargo run --locked --quiet --release --manifest-path scripts/ledger/Cargo.toml -- --tsv "$RUNNER_TEMP/ledger.tsv" >/dev/null
          git checkout -- docs/LEDGER.md
          tool=(cargo run --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml --)
          "${tool[@]}" fetch --sources "$RUNNER_TEMP/pins"
          baseline=()
          if git show "$BASE:docs/media/fork-progress.json" >"$RUNNER_TEMP/baseline.json" 2>/dev/null; then
            baseline=(--baseline "$RUNNER_TEMP/baseline.json")
          fi
          allow=()
          printf '%s\n' "$BODY" | tr -d '\r' >"$RUNNER_TEMP/pr-body.md"
          if grep -qE '^Progress-Drop: *[^ ]' "$RUNNER_TEMP/pr-body.md"; then allow=(--allow-drop); fi
          # The upstream replay (this repository's own sync branch) carries upstream's changes as they are: its drops
          # are reported, not refused.
          if [ "$HEAD_REF" = sync/upstream ] && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then allow=(--allow-drop); fi
          "${tool[@]}" check --sources "$RUNNER_TEMP/pins" --ledger "$RUNNER_TEMP/ledger.tsv" "${baseline[@]}" "${allow[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The coverage catalogue (.fork/catalogue, docs/fork/CATALOGUE.md): its generated reference lists match the pinned
      # sources, the code's evidence of Direct3D 9 and the graphics plan, the ledger and .fork/capabilities.json agree
      # with what it declares, and its ids, pins and test tags are well formed (tally, a pinned release binary). Tags are
      # read from the source here; whether the tagged tests pass on each OS comes from the test runs' results.
      - name: Catalogue (tally)
        env:
          TALLY_VERSION: v0.3.0
          TALLY_SHA256: 3b52c64e4b26015c3a18703446948e92b18d7e4a70f5600b3915549ef287dd82
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/progress-target"
          mkdir -p target/catalogue
          cp "$RUNNER_TEMP/ledger.tsv" target/catalogue/ledger.tsv
          cargo run --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml -- catalogue --check \
            --sources "$RUNNER_TEMP/pins" --ledger "$RUNNER_TEMP/ledger.tsv" --evidence target/catalogue/evidence.tsv
          curl -fsSL -o "$RUNNER_TEMP/tally" "https://github.com/JorisJonkers-dev/tally/releases/download/$TALLY_VERSION/tally-x86_64-unknown-linux-gnu"
          echo "$TALLY_SHA256  $RUNNER_TEMP/tally" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tally"
          "$RUNNER_TEMP/tally" check --catalogue .fork/catalogue --base "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/tally" report --catalogue .fork/catalogue --depth 2 --format md >>"$GITHUB_STEP_SUMMARY"

  pipeline-complete:
    name: Pipeline Complete
    needs: [changes, hygiene, pr-title, lint, verify-sync, layout-window, progress, build, coverage, facade, macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/fork

      # A skipped job fails, except the four that only run on pull requests (hygiene also skips when
      # its override label is set), the build when only documentation or fork-owned files changed and the macOS job
      # when only documentation changed.
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r '. as $n | to_entries[] | select(.value.result != "success") | select(.value.result != "skipped" or ((.key | IN("hygiene", "pr-title", "coverage", "progress")) or ((.key == "build") and $n.changes.outputs.code == "false") or ((.key == "macos") and $n.changes.outputs.native == "false") | not)) | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then echo "::error title=Pipeline::$failed"; exit 1; fi

      # Read-only; shown whether the pipeline passed or not: every component's result and duration.
      - name: Summary of the run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/fork/pipeline_summary.py --run "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --exclude "Pipeline Complete" >>"$GITHUB_STEP_SUMMARY"
