# Fork-only (JorisJonkers-dev/nv-rs). One pipeline ending in "Pipeline Complete", the only required
# check (estate convention). The build is one job per engine component (fork-build.yml, .fork/components.toml,
# docs/fork/CI.md); the repository's own checks run in parallel with it; Pipeline Complete gathers every result
# and prints each component's result and duration. The two reusable workflows (hygiene, PR title) are jobs.
# Upstream's own gate, .github/workflows/ci.yml (Windows, ~140 minutes), is not required here.
name: Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [fork]
  workflow_dispatch:
  # Every component, also the slow integration tests: a pull request runs only what its change reaches.
  schedule:
    - cron: '17 3 * * *'

# A new commit on a branch cancels the run still going for the older one: runners are limited and the older
# result is of no use. Not cancelled: a title edit (its own group, so it neither cancels nor is cancelled by a
# push; no label events trigger this workflow, so a bot labelling a new pull request starts nothing) and the fork
# branch (every commit there runs to the end, so it always has a finished run and its caches are saved).
concurrency:
  group: pipeline-${{ github.ref == 'refs/heads/fork' && github.sha || format('{0}-{1}', github.event.pull_request.number || github.ref, github.event.action == 'edited' && github.run_id || 'commits') }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/fork' }}

permissions:
  contents: read

jobs:
  # Pull requests that only change documentation or the fork's own files skip the builds (see the diff step). The gate below still runs and still requires everything else.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A push to the fork branch always runs the builds: it verifies the result and fills the caches.
          if [ "$EVENT" = push ] || [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >>"$GITHUB_OUTPUT"; echo "building (push, or no base to compare with)"; exit 0
          fi
          # On a pull request the Rust builds verify UPSTREAM's code. A change that only touches documentation or the fork's own
          # files (.fork/overlay-paths) cannot change that, so the builds are skipped. Files that steer the builds still count.
          BASE="$BASE" HEAD="$HEAD" python3 -I -c '
          import os, re, subprocess
          def diff(flt):
              out = subprocess.run(["git", "diff", "--name-only", "--diff-filter=" + flt, os.environ["BASE"] + "..." + os.environ["HEAD"]],
                                   capture_output=True, text=True, check=True).stdout
              return [f for f in out.splitlines() if f]
          overlay = [l.split("#")[0].strip() for l in open(".fork/overlay-paths", encoding="utf-8")]
          overlay = [o for o in overlay if o]
          # Files that steer the builds count when they are MODIFIED (an existing, verified behaviour changes); a newly added
          # file cannot change what an earlier run verified, and the push to the fork branch runs the full builds anyway.
          steering = re.compile(r"^(\.fork/(linux-ok\.txt|components\.toml)|\.github/workflows/fork-build\.yml|scripts/fork/(linux_probe|components|libtest_summary|clippy_annotations)\.py|scripts/fork/run-component\.sh)$")
          docs = re.compile(r"^(docs/|LICENSE$|.*\.md$)")
          fork_owned = lambda f: any(f == o or (o.endswith("/") and f.startswith(o)) for o in overlay)
          code = [f for f in diff("ACDMRT") if not (docs.match(f) or fork_owned(f))]
          code += [f for f in diff("MDR") if steering.match(f)]
          print("code files:", ", ".join(code[:10]) or "none", file=__import__("sys").stderr)
          print("code=" + ("true" if code else "false"))
          ' >>"$GITHUB_OUTPUT"

  hygiene:
    name: Hygiene
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3

  pr-title:
    name: PR title
    if: ${{ github.event_name == 'pull_request' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/pr-title-check.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3

  # Upstream's ci.yml, as one job per engine component (.fork/components.toml); see fork-build.yml.
  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/fork-build.yml

  # The repository's own checks, in parallel with the builds. Separate steps so one failing check does not hide
  # the others.
  lint:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true
          # A pull request's merge ref would write its own 97 MB copy of the same cache.
          cache_save: ${{ github.ref == 'refs/heads/fork' }}

      - name: Workflows
        run: mise exec -- task lint:actions
      - name: Dependencies
        if: ${{ !cancelled() }}
        run: mise exec -- task deny
      - name: Script self-tests
        if: ${{ !cancelled() }}
        run: mise exec -- task scripts
      - name: Secrets
        if: ${{ !cancelled() }}
        run: mise exec -- task secrets

  pipeline-complete:
    name: Pipeline Complete
    needs: [changes, hygiene, pr-title, lint, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/fork

      # A skipped job fails, except the two that only run on pull requests (hygiene also skips when
      # its override label is set) and the build when only documentation changed.
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r '. as $n | to_entries[] | select(.value.result != "success") | select(.value.result != "skipped" or ((.key | IN("hygiene", "pr-title")) or ((.key == "build") and $n.changes.outputs.code == "false") | not)) | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then echo "::error title=Pipeline::$failed"; exit 1; fi

      # Read-only; shown whether the pipeline passed or not: every component's result and duration.
      - name: Summary of the run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/fork/pipeline_summary.py --run "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --exclude "Pipeline Complete" >>"$GITHUB_STEP_SUMMARY"
