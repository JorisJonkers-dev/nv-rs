# Fork-only (JorisJonkers-dev/nv-rs). One pipeline ending in "Pipeline Complete", the only required
# check (estate convention). The build is one job per engine component (fork-build.yml, .fork/components.toml,
# docs/fork/CI.md); the repository's own checks run in parallel with it; Pipeline Complete gathers every result
# and prints each component's result and duration. The two reusable workflows (hygiene, PR title) are jobs.
# This workflow runs for COMMITS only: a push, a new pull request, a reopen. Editing a pull request's title or
# description does not start it (no `edited` trigger), so those edits create no "Pipeline Complete" check run and the
# run of the commits stays the only source of the required check. The checks that read the title or the description
# are in fork-pr-text.yml (the "PR text / ..." checks). Here the Progress-Drop rule is not applied and the
# Upstream-Commit trailer is not read; both are enforced there. A change of the base branch does not rebuild either;
# fork-pr-text.yml reports it (see docs/fork/CI.md).
# Upstream's own gate, .github/workflows/ci.yml (Windows, ~140 minutes), is not required here.
name: Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [fork]
  workflow_dispatch:
  # Every component, also the slow integration tests: a pull request runs only what its change reaches.
  schedule:
    - cron: '17 3 * * *'

# A new commit on a branch cancels the run still going for the older one: runners are limited and the older
# result is of no use. Not cancelled: the fork branch (every commit there runs to the end, so it always has a
# finished run and its caches are saved).
concurrency:
  group: pipeline-${{ github.ref == 'refs/heads/fork' && github.sha || format('{0}-commits', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/fork' }}

permissions:
  contents: read

env:
  # The pinned tally release (https://github.com/JorisJonkers-dev/tally) and the SHA-256 of its Linux binary, from
  # that release's SHA256SUMS.
  TALLY_VERSION: v0.8.0
  TALLY_SHA256: 5dc487d3f84248e5a80a06f989acb31b3040ee77342656971437f76493e925e6
  # The generated reports: the only files the `reports` job may commit on fork. The census reads crates/ and
  # becomes stale on any engine change, so it is regenerated here rather than checked on every pull request.
  REPORT_FILES: >-
    docs/fork/coverage/FEATURES.md
    docs/fork/coverage/tally-report.json
    docs/fork/coverage/tally.svg
    docs/fork/COMPONENT-CENSUS.md

jobs:
  # Pull requests that only change documentation or the fork's own files skip the builds (see the diff step). The gate below still runs and still requires everything else.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      native: ${{ steps.diff.outputs.native }}
      census: ${{ steps.diff.outputs.census }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A push to the fork branch always runs the builds: it verifies the result and fills the caches.
          if [ "$EVENT" = push ] || [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            { echo "code=true"; echo "native=true"; echo "census=false"; } >>"$GITHUB_OUTPUT"; echo "building (push, or no base to compare with)"; exit 0
          fi
          # On a pull request the Rust builds verify UPSTREAM's code. A change that only touches documentation or the fork's own
          # files (.fork/overlay-paths) cannot change that, so the builds are skipped. Files that steer the builds still count.
          BASE="$BASE" HEAD="$HEAD" python3 -I -c '
          import os, re, subprocess
          def diff(flt):
              out = subprocess.run(["git", "diff", "--name-only", "--diff-filter=" + flt, os.environ["BASE"] + "..." + os.environ["HEAD"]],
                                   capture_output=True, text=True, check=True).stdout
              return [f for f in out.splitlines() if f]
          overlay = [l.split("#")[0].strip() for l in open(".fork/overlay-paths", encoding="utf-8")]
          overlay = [o for o in overlay if o]
          # Files that steer the builds count when they are MODIFIED (an existing, verified behaviour changes); a newly added
          # file cannot change what an earlier run verified, and the push to the fork branch runs the full builds anyway.
          steering = re.compile(r"^(\.fork/(linux-ok\.txt|components\.toml)|\.github/workflows/fork-build\.yml|scripts/fork/(linux_probe|components|libtest_summary|clippy_annotations)\.py|scripts/fork/run-component\.sh)$")
          docs = re.compile(r"^(docs/|LICENSE$|.*\.md$)")
          fork_owned = lambda f: any(f == o or (o.endswith("/") and f.startswith(o)) for o in overlay)
          code = [f for f in diff("ACDMRT") if not (docs.match(f) or fork_owned(f))]
          code += [f for f in diff("MDR") if steering.match(f)]
          print("code files:", ", ".join(code[:10]) or "none", file=__import__("sys").stderr)
          print("code=" + ("true" if code else "false"))
          # The macOS job also checks fork-owned crates (fork-window, the facade): it runs unless only documentation changed.
          native = [f for f in diff("ACDMRT") if not docs.match(f)]
          print("native=" + ("true" if native else "false"))
          # A pull request that changes the census tool or its declarations must carry a matching report.
          # Other changes are regenerated on fork, so they do not fail on a stale generated file.
          census_files = ("research/component-census/", "docs/fork/COMPONENT-CENSUS.md")
          census = [f for f in diff("ACDMRT") if f.startswith(census_files[0]) or f == census_files[1]]
          print("census=" + ("true" if census else "false"))
          ' >>"$GITHUB_OUTPUT"

  hygiene:
    name: Hygiene
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    uses: JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@8e402cc4904be3f6bdb53bad3d9b5d7951bed491 # v0.50.3

  # Every commit of the pull request is a conventional commit and credits no coding agent. The title and the
  # description are checked in fork-pr-text.yml, so fixing them does not need a new commit here. The script wants a
  # title; a fixed valid one is passed because only the commits are read in this job.
  commit-messages:
    name: Commit messages
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JorisJonkers-dev/github-workflows
          ref: v0.50.3
          path: .github-workflows
          persist-credentials: false
      - name: Check every commit message
        env:
          PR_TITLE: 'chore: commit messages only'
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}")"
          python3 .github-workflows/scripts/pr_title_check.py --range "${base}..${HEAD_SHA}"

  # Upstream's ci.yml, as one job per engine component (.fork/components.toml); see fork-build.yml.
  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: ./.github/workflows/fork-build.yml

  # The repository's own checks, in parallel with the builds. Separate steps so one failing check does not hide
  # the others.
  lint:
    name: Repository checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          cache: true
          # A pull request's merge ref would write its own 97 MB copy of the same cache.
          cache_save: ${{ github.ref == 'refs/heads/fork' }}

      - name: Workflows
        run: mise exec -- task lint:actions
      - name: Dependencies
        if: ${{ !cancelled() }}
        run: mise exec -- task deny
      - name: Script self-tests
        if: ${{ !cancelled() }}
        run: mise exec -- task scripts
      - name: Extender move inventory
        if: ${{ !cancelled() }}
        run: python3 -I scripts/fork/extender_move_inventory.py --check
      # The census tool's own tests run on every pull request and push. The report it writes is generated on
      # fork by "Catalogue results" and committed by "Catalogue reports"; checking it on every pull request
      # failed unrelated engine changes (#965), so the check is limited to the tool and its declarations.
      - name: Census tool tests
        if: ${{ !cancelled() }}
        run: |
          rustup toolchain install
          cargo test --locked --manifest-path research/component-census/Cargo.toml
      - name: Component census
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.census == 'true' }}
        run: cargo run --locked --quiet --manifest-path research/component-census/Cargo.toml -- --check
      - name: Secrets
        if: ${{ !cancelled() }}
        run: mise exec -- task secrets

  # The crates a program that links the engine depends on (docs/fork/CONSUMING.md), each built alone, as the Toolbox's raul
  # builds them. Runs on every pull request and push to fork: the crates are fork-owned, so the `changes` filter would skip them.
  facade:
    name: Facade crates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: facade-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - name: fork-api
        run: cargo check --locked -p fork-api
      - name: fork-api with the engine
        if: ${{ !cancelled() }}
        run: cargo check --locked -p fork-api --features engine
      - name: fork-play
        if: ${{ !cancelled() }}
        run: cargo check --locked -p fork-play

  # The engine on macOS (Apple silicon, wgpu on Metal; nv-rs#378): the crates the Toolbox links and the window and
  # device layers build, and their tests that need no game run. The game's window on macOS is nv-rs#379; until then
  # the device layer stays off screen there. Skipped when only documentation changed.
  macos:
    name: macOS
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: never
      # Apple silicon runners have 7 GB of memory: two compilers at a time.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - name: The window and device layers and the platform layer
        run: cargo build --locked -p fork-window -p d3d9-wgpu -p engine-platform
      - name: fork-api with the engine
        if: ${{ !cancelled() }}
        run: cargo check --locked -p fork-api --features engine
      - name: fork-play
        if: ${{ !cancelled() }}
        run: cargo check --locked -p fork-play
      # The log goes to the coverage catalogue's results (job "Catalogue results").
      - name: Tests that need no game
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/testlog"
          cargo test --locked --no-fail-fast -p fork-window -p d3d9-wgpu -p engine-platform 2>&1 | tee "$RUNNER_TEMP/testlog/test-macos.log"
      # The packages whose tests the coverage catalogue tags (docs/fork/CATALOGUE.md), so an item can be covered on all
      # three systems. Pushes, the schedule and manual runs only: pull requests keep the short macOS job. The dev
      # dependencies switch on nvse's test support. A failed or missing log here lowers covered, and the ratchet of
      # "Catalogue results" then fails the run.
      - name: Tests of the catalogue's packages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/testlog"
          cargo test --locked --no-fail-fast -p nvse -p jip -p jg -p showoff -p ttw-nvse -p fork-catalogue -p fork-gfx 2>&1 | tee "$RUNNER_TEMP/testlog/test-macos-tagged.log"
      # The engine's tests that the catalogue tags (.fork/catalogue/covers.d/engine_typed.tsv), so those engine functions
      # can be covered on all three systems: built once, the test binaries side by side (scripts/fork/tagged-engine-tests.sh).
      # In this job, not one of its own: one macOS runner per run (a second one waited in the queue for this one), one
      # cache, and the crates.io and platform crates built above are reused. Same events as the step above.
      - name: Tagged engine tests
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: scripts/fork/tagged-engine-tests.sh "$RUNNER_TEMP/testlog/test-macos-engine.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: testlog-macos
          path: ${{ runner.temp }}/testlog/
          if-no-files-found: warn
          retention-days: 7

  # The tagged engine tests (as in the macOS job) on Linux: the component jobs run crates/engine/tests only on Windows, so without this
  # none of those engine functions could be covered. Pushes, the schedule and manual runs only.
  linux-engine:
    name: Linux (tagged engine tests)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-engine
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - name: Tagged engine tests
        run: scripts/fork/tagged-engine-tests.sh "$RUNNER_TEMP/testlog/test-linux-engine.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: testlog-linux-engine
          path: ${{ runner.temp }}/testlog/
          if-no-files-found: warn
          retention-days: 7

  # Coverage of the components the change reaches, and the changed-line coverage gate of the fork-owned crates
  # (fork-coverage.yml, docs/fork/COVERAGE.md). Pull requests only; the nightly baseline is that workflow's own schedule.
  coverage:
    name: Coverage
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/fork-coverage.yml

  # Upstream-owned files may differ from upstream only where .fork/allowed-divergence says so. Cheap, so it runs on every
  # pull request and push, also when the builds are skipped; it needs the history and upstream's copy (main). The
  # replay point in the description is checked in fork-pr-text.yml.
  verify-sync:
    name: Verify sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main (the upstream copy)
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: No divergence outside the overlay
        run: scripts/fork/verify-sync.sh

  # A change to a layout constant of engine-core's mem.rs (the heap's ranges, the platform area, the extenders' code and
  # the helper area) must pass the window test before it merges (nv-rs#272, scripts/fork/layout_gate.py): the heap's
  # tests at lowered windows state the ranges' sizes, so a moved constant fails them. Cheap when nothing moved.
  layout-window:
    name: Layout window test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did a layout constant change
        id: layout
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I scripts/fork/layout_gate.py check --base "${BASE:-HEAD^}" --head "$HEAD" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The window test
        if: ${{ steps.layout.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          rustup toolchain install
          cargo test --locked -p engine-core --lib -- mem::heap::tests::

  # The progress pictures' generator (docs/fork/PROGRESS.md, scripts/fork/progress) in check mode on every pull request,
  # so it cannot break unseen: its tests, two counts of the merged tree that must agree, and the counts against the base's
  # summary. A count that goes down is only reported here; whether the description excuses it
  # (`Progress-Drop: <reason>`) is checked in fork-pr-text.yml ("PR text / Progress counts"). Its report is in the run summary. The pictures themselves are committed after the merge
  # (fork-progress.yml).
  progress:
    name: Progress counts
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the counts
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rustup toolchain install
          export CARGO_TARGET_DIR="$RUNNER_TEMP/progress-target"
          cargo test --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml
          cargo run --locked --quiet --release --manifest-path scripts/ledger/Cargo.toml -- --tsv "$RUNNER_TEMP/ledger.tsv" >/dev/null
          git checkout -- docs/LEDGER.md
          tool=(cargo run --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml --)
          "${tool[@]}" fetch --sources "$RUNNER_TEMP/pins"
          baseline=()
          if git show "$BASE:docs/media/fork-progress.json" >"$RUNNER_TEMP/baseline.json" 2>/dev/null; then
            baseline=(--baseline "$RUNNER_TEMP/baseline.json")
          fi
          # A drop is reported here, never refused: the description's Progress-Drop line is read by fork-pr-text.yml.
          allow=(--allow-drop)
          "${tool[@]}" check --sources "$RUNNER_TEMP/pins" --ledger "$RUNNER_TEMP/ledger.tsv" "${baseline[@]}" "${allow[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The coverage catalogue (.fork/catalogue, docs/fork/CATALOGUE.md): its generated reference lists match the pinned
      # sources, the code's evidence of Direct3D 9 and the graphics plan, the ledger and .fork/capabilities.json agree
      # with what it declares, and its ids, pins and test tags are well formed (tally, a pinned release binary). Tags are
      # read from the source here; whether the tagged tests pass on each OS comes from the test runs' results.
      - name: Catalogue (tally)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/progress-target"
          mkdir -p target/catalogue
          cp "$RUNNER_TEMP/ledger.tsv" target/catalogue/ledger.tsv
          cargo run --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml -- catalogue --check \
            --sources "$RUNNER_TEMP/pins" --ledger "$RUNNER_TEMP/ledger.tsv" --evidence target/catalogue/evidence.tsv
          curl -fsSL -o "$RUNNER_TEMP/tally" "https://github.com/JorisJonkers-dev/tally/releases/download/$TALLY_VERSION/tally-x86_64-unknown-linux-gnu"
          echo "$TALLY_SHA256  $RUNNER_TEMP/tally" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tally"
          # Pull requests never carry the generated reports, so none can lower the bar the ratchet on fork measures against.
          # Only the branch's own changes count (from where it left fork): a report the bot commits on fork while the
          # pull request runs is not the pull request's change.
          if git diff --name-only "$BASE...$PR_HEAD" -- docs/fork/coverage | grep -q .; then
            echo "::error title=Catalogue::docs/fork/coverage/ is generated on fork; leave it out of the pull request"; exit 1
          fi
          "$RUNNER_TEMP/tally" check --catalogue .fork/catalogue --base "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/tally" report --catalogue .fork/catalogue --depth 2 --format md >>"$GITHUB_STEP_SUMMARY"

  # The coverage catalogue with the test results (docs/fork/CATALOGUE.md, "Results"), on the fork branch, the schedule
  # and a manual run, where every component runs: each component job's test log and the macOS job's are read with
  # `tally ingest --libtest`. An item is covered when a tagged test passed on Linux, Windows and macOS. The ratchet
  # holds: the covered (and tagged) count does not drop below the report of the commit before
  # (docs/fork/coverage/tally-report.json). On a push the step also renders the reports for the `reports` job.
  # Pull requests run only the components a change reaches, so their results would be partial: they keep the
  # check without results in "Progress counts". On a push the step also regenerates the component census from the
  # tested commit, so an engine change cannot leave the generated report stale on fork.
  catalogue:
    name: Catalogue results
    needs: [changes, build, macos, linux-engine]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      reports: ${{ steps.catalogue.outputs.reports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: testlog-*
          merge-multiple: true
          path: ${{ runner.temp }}/testlog
      - name: Catalogue (tally)
        id: catalogue
        env:
          BASE: ${{ github.event.before }}
          LOGS: ${{ runner.temp }}/testlog
        run: |
          set -euo pipefail
          # The files the `reports` job commits must not be ignored, or its `git add` fails there.
          # shellcheck disable=SC2086
          if ignored="$(git check-ignore --no-index -v $REPORT_FILES)"; then
            echo "::error title=Catalogue::report files are ignored by .gitignore: $ignored"; exit 1
          fi
          rustup toolchain install
          export CARGO_TARGET_DIR="$RUNNER_TEMP/progress-target"
          cargo run --locked --quiet --release --manifest-path scripts/ledger/Cargo.toml -- --tsv "$RUNNER_TEMP/ledger.tsv" >/dev/null
          git checkout -- docs/LEDGER.md
          tool=(cargo run --locked --quiet --release --manifest-path scripts/fork/progress/Cargo.toml --)
          "${tool[@]}" fetch --sources "$RUNNER_TEMP/pins"
          mkdir -p target/catalogue
          cp "$RUNNER_TEMP/ledger.tsv" target/catalogue/ledger.tsv
          "${tool[@]}" catalogue --check --sources "$RUNNER_TEMP/pins" --ledger "$RUNNER_TEMP/ledger.tsv" --evidence target/catalogue/evidence.tsv
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/tally" "https://github.com/JorisJonkers-dev/tally/releases/download/$TALLY_VERSION/tally-x86_64-unknown-linux-gnu"
          echo "$TALLY_SHA256  $RUNNER_TEMP/tally" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tally"
          tally=("$RUNNER_TEMP/tally")
          # Every component ran, so a system without a log is a lost upload or a job that did not finish: that must
          # not switch the ratchet off.
          logs=()
          for os in linux windows macos; do
            found=("$LOGS"/test-"$os"*.log)
            if [ ! -f "${found[0]}" ]; then
              echo "::error title=Catalogue::no test log from $os; the covered count needs all three systems"; exit 1
            fi
            for f in "${found[@]}"; do logs+=(--libtest "$f"); done
          done
          # The macOS job and the Linux engine job write logs the glob above does not single out: require each by name, or a lost
          # one would drop covered without an error.
          for f in test-macos.log test-macos-tagged.log test-macos-engine.log test-linux-engine.log; do
            if [ ! -f "$LOGS/$f" ]; then
              echo "::error title=Catalogue::no test log $f"; exit 1
            fi
          done
          "${tally[@]}" ingest "${logs[@]}" --out "$RUNNER_TEMP/results.json"
          args=(--catalogue .fork/catalogue --results "$RUNNER_TEMP/results.json")
          # The ratchet measures against the report of the commit before this push; on the schedule and a manual run,
          # against the report of the tested commit.
          ratchet=()
          if [ -n "${BASE:-}" ] && git show "${BASE}:docs/fork/coverage/tally-report.json" >"$RUNNER_TEMP/base-report.json" 2>/dev/null; then
            ratchet=(--ratchet "$RUNNER_TEMP/base-report.json")
          elif [ -f docs/fork/coverage/tally-report.json ]; then
            ratchet=(--ratchet docs/fork/coverage/tally-report.json)
          fi
          "${tally[@]}" check "${args[@]}" "${ratchet[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          "${tally[@]}" report "${args[@]}" --depth 2 --format md >>"$GITHUB_STEP_SUMMARY"
          [ "$GITHUB_EVENT_NAME" = push ] || exit 0
          # Rendered in a clean worktree of the tested commit, so nothing the earlier steps left behind is picked up.
          git worktree add --quiet --detach "$RUNNER_TEMP/render" HEAD
          mkdir -p "$RUNNER_TEMP/render/target/catalogue"
          cp target/catalogue/ledger.tsv target/catalogue/evidence.tsv "$RUNNER_TEMP/render/target/catalogue/"
          cd "$RUNNER_TEMP/render"
          mkdir -p docs/fork/coverage
          {
            echo "# Coverage catalogue"
            echo
            echo "Generated on fork by tally from \`.fork/catalogue\` (docs/fork/CATALOGUE.md). Do not edit."
            echo
            "${tally[@]}" report "${args[@]}" --depth 2 --format md
          } >docs/fork/coverage/FEATURES.md
          # Depth 2 (areas and groups): the items would add one row per engine function, about 15 MB per commit.
          "${tally[@]}" report "${args[@]}" --depth 2 --format json --out docs/fork/coverage/tally-report.json
          "${tally[@]}" report "${args[@]}" --depth 1 --format svg --out docs/fork/coverage/tally.svg
          # Regenerate the census from this worktree's crates/ and declarations. The paths are explicit because
          # CARGO_MANIFEST_DIR is baked into a cached binary; CARGO_TARGET_DIR is outside the worktree, so the
          # only tracked change is the report the `reports` job commits with the others.
          cargo run --locked --quiet --manifest-path research/component-census/Cargo.toml -- \
            --root "$RUNNER_TEMP/render" \
            --components "$RUNNER_TEMP/render/research/component-census/components.tsv" \
            --out "$RUNNER_TEMP/render/docs/fork/COMPONENT-CENSUS.md"
          # Only the report files may change; anything else stops the run (target/ is ignored).
          # shellcheck disable=SC2086
          printf '%s\n' $REPORT_FILES >"$RUNNER_TEMP/allowed"
          git status --porcelain --untracked-files=all | cut -c4- >"$RUNNER_TEMP/changed"
          if [ ! -s "$RUNNER_TEMP/changed" ]; then
            echo "The catalogue reports are up to date: nothing to commit." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          other="$(grep -vxF -f "$RUNNER_TEMP/allowed" "$RUNNER_TEMP/changed" || true)"
          if [ -n "$other" ]; then
            echo "::error title=Catalogue::files other than the reports changed: $other"; exit 1
          fi
          echo "reports=changed" >>"$GITHUB_OUTPUT"
          { echo "Catalogue reports changed:"; sed 's/^/- /' "$RUNNER_TEMP/changed"; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.catalogue.outputs.reports == 'changed' }}
        with:
          name: report-files
          # Both paths are relative to their common root (docs/fork/) in the artifact: the coverage
          # files keep their `coverage/` prefix and the census sits beside that folder. The reports
          # job strips `docs/fork/` when copying the files back (see `${f#docs/fork/}` below).
          path: |
            ${{ runner.temp }}/render/docs/fork/coverage/
            ${{ runner.temp }}/render/docs/fork/COMPONENT-CENSUS.md
          retention-days: 3

  pipeline-complete:
    name: Pipeline Complete
    needs: [changes, hygiene, commit-messages, lint, verify-sync, layout-window, progress, build, coverage, facade, macos, linux-engine, catalogue]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/fork

      # A skipped job fails, except the four that only run on pull requests (hygiene also skips when
      # its override label is set), "Catalogue results" and the Linux tagged-engine-test job on a pull request (they run on fork only), the build when only documentation or fork-owned files changed and the macOS job
      # when only documentation changed.
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(jq -r --arg ev "$GITHUB_EVENT_NAME" '. as $n | to_entries[] | select(.value.result != "success") | select(.value.result != "skipped" or ((.key | IN("hygiene", "commit-messages", "coverage", "progress")) or ((.key == "catalogue" or .key == "linux-engine") and $ev == "pull_request") or ((.key == "build") and $n.changes.outputs.code == "false") or ((.key == "macos") and $n.changes.outputs.native == "false") | not)) | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then echo "::error title=Pipeline::$failed"; exit 1; fi

      # Read-only; shown whether the pipeline passed or not: every component's result and duration.
      - name: Summary of the run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/fork/pipeline_summary.py --run "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --exclude "Pipeline Complete" >>"$GITHUB_STEP_SUMMARY"

  # On a push to fork, the coverage-catalogue reports and the component census rendered by "Catalogue results" go onto
  # fork as one commit of generated files only, marked with the skip-ci marker, when one changed and every job passed.
  # This job runs no repository code: a fresh checkout, the rendered files copied in, a commit and a push with the
  # token of raul-progress-bot
  # (contents write, metadata read; the bypass actor of the ruleset "Fork line"; scripts/fork/setup-progress-bot.py).
  # Git hooks are off for that commit and push. Without the App's variable and secret nothing is pushed.
  reports:
    name: Catalogue reports
    needs: [catalogue, pipeline-complete]
    # Explicit result checks: the implicit success() is false on a push, because the pull-request-only jobs upstream of
    # Pipeline Complete are skipped there.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/fork' && needs.pipeline-complete.result == 'success' && needs.catalogue.outputs.reports == 'changed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_APP: ${{ vars.PROGRESS_APP_ID != '' && secrets.PROGRESS_APP_PRIVATE_KEY != '' }}
      # The progress pictures' own bot commit (fork-progress.yml) may land first; only those files may lie between the
      # tested commit and the branch head.
      OTHER_BOT_FILES: >-
        docs/media/fork-progress.json
        docs/media/fork-progress-engine.svg
        docs/media/fork-progress-native.svg
        docs/media/fork-progress-d3d9.svg
        docs/media/fork-progress-extenders.svg
        docs/media/fork-progress-features.svg
    steps:
      - name: No App to push with
        if: ${{ env.HAS_APP != 'true' }}
        run: echo "::warning title=Catalogue reports::the reports changed, but PROGRESS_APP_ID or PROGRESS_APP_PRIVATE_KEY is not set; nothing pushed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.HAS_APP == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.HAS_APP == 'true' }}
        with:
          name: report-files
          path: ${{ runner.temp }}/report-files
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ env.HAS_APP == 'true' }}
        with:
          app-id: ${{ vars.PROGRESS_APP_ID }}
          private-key: ${{ secrets.PROGRESS_APP_PRIVATE_KEY }}
          permission-contents: write
      # The commit goes on the branch head when the head is the tested commit, or the tested commit plus only the progress
      # pictures' bot commit. Any other commit on top has its own run, which commits.
      - name: Commit and push
        if: ${{ env.HAS_APP == 'true' }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git=(git -c core.hooksPath=/dev/null -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          "${git[@]}" fetch --quiet "$remote" refs/heads/fork
          head="$("${git[@]}" rev-parse FETCH_HEAD)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            # shellcheck disable=SC2086
            printf '%s\n' $OTHER_BOT_FILES >"$RUNNER_TEMP/other"
            if ! "${git[@]}" merge-base --is-ancestor "$GITHUB_SHA" "$head" \
              || "${git[@]}" diff --name-only "$GITHUB_SHA" "$head" | grep -vxF -f "$RUNNER_TEMP/other" | grep -q .; then
              echo "::notice title=Catalogue reports::fork moved on ($head); the newer run commits"
              exit 0
            fi
            "${git[@]}" checkout --quiet --detach "$head"
          fi
          mkdir -p docs/fork/coverage
          # upload-artifact stored both paths relative to docs/fork/, so ${f#docs/fork/} names every
          # file in the artifact, including COMPONENT-CENSUS.md. Refuse an empty file rather than
          # committing a report that would blank the one already on fork.
          for f in $REPORT_FILES; do
            cp "$RUNNER_TEMP/report-files/${f#docs/fork/}" "$f"
            test -s "$f" || { echo "::error title=Catalogue::empty report $f"; exit 1; }
          done
          # shellcheck disable=SC2086
          "${git[@]}" add -- $REPORT_FILES
          if "${git[@]}" diff --cached --quiet; then
            echo "Nothing to commit." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "${git[@]}" commit --quiet -m "chore(catalogue): update the generated reports [skip ci]"
          "${git[@]}" push --quiet "$remote" "HEAD:refs/heads/fork"
          echo "Pushed $(git rev-parse --short HEAD)." >>"$GITHUB_STEP_SUMMARY"
