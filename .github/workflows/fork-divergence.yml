# Fork-only. What a pull request changes in upstream-owned code, as one sticky comment (docs/fork/DIVERGENCE.md,
# "Process"): which upstream-owned files, how many lines, the total divergence against the budget of
# .fork/divergence-budget.toml, and whether DIVERGENCE.md records each new file. It WARNS ONLY: it is not part of
# Pipeline Complete, not a required check, and neither job can fail a pull request for what it finds.
# The comment job is the only one with a write permission; it runs no repository code (it posts a file the report job
# rendered), and a pull request from a fork gets no comment (its token cannot write); its report is in the run summary.
name: Divergence

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: divergence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Divergence report
    # The sync pull request replays upstream-owned changes by design.
    if: ${{ github.head_ref != 'sync/upstream' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Render the comment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -I scripts/fork/divergence_report.py report --base "$BASE" --head "$HEAD" --out comment.md --json summary.json >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: divergence-comment
          path: |
            comment.md
            summary.json
          retention-days: 30

  comment:
    name: Divergence comment
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: divergence-comment
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- fork-divergence -->"))][0].id // empty')"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
