# Fork-only (JorisJonkers-dev/nv-rs). Line coverage of the engine components a pull request reaches, as one sticky
# comment: this pull request against the base, the delta, a table per component and the changed lines no test ran
# (docs/fork/COVERAGE.md). On a pull request it runs as the job `coverage` of fork-ci.yml (workflow_call), so its
# `coverage-gate` job is part of Pipeline Complete: changed lines of the fork-owned crates below the minimum of
# .fork/coverage-gate.toml fail the pipeline once a nightly baseline exists. Everything else reports and never blocks.
# The same affected selection as the build (scripts/fork/components.py), Linux only, cargo-llvm-cov, one job per
# component. The nightly run (and a manual run) of this workflow on its own measures every Linux component and stores
# the result as the baseline the pull requests compare with; with no baseline yet a job measures the base commit itself.
# The comment job is the only one with a write permission; it runs no repository code (it posts a file the report job
# rendered), and a pull request from a fork gets no comment (its token cannot write); its report is in the run summary.
name: Coverage

on:
  # Pull requests: called by fork-ci.yml. The schedule and a manual run make the baseline.
  workflow_call: {}
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

# No concurrency group of its own: on a pull request the caller's (fork-ci.yml) cancels older runs.

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS_WHEN: never
  LLVM_COV_VERSION: 0.9.1

jobs:
  plan:
    name: Plan coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I scripts/fork/coverage_report.py plan --event "$EVENT" --base "$BASE" --head "$HEAD" >plan.json
          echo "matrix=$(jq -c '{include: .include}' plan.json)" >>"$GITHUB_OUTPUT"
          echo "has_jobs=$(jq '.include | length > 0' plan.json)" >>"$GITHUB_OUTPUT"
          { echo "### Components to measure"; echo; echo "Reason: $(jq -r .reason plan.json)"; echo; jq -r '.include[] | "- \(.component): `\(.args)`"' plan.json; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-plan
          path: plan.json
          retention-days: 7

  measure:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ needs.plan.outputs.has_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A failing component must not turn the run red: the report names what was not measured.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      COMPONENT: ${{ matrix.component }}
      ARGS: ${{ matrix.args }}
      GH_TOKEN: ${{ github.token }}
      IGNORE: '(^|/)tests/|_tests?\.rs$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install && rustup component add llvm-tools
      # Only the crates.io dependencies (and the installed cargo-llvm-cov) are restored; saved by the nightly run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
          shared-key: cov-${{ matrix.cache }}-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/fork' }}
      - name: Install cargo-llvm-cov
        run: |
          if ! command -v cargo-llvm-cov >/dev/null || [ "$(cargo llvm-cov --version | cut -d' ' -f2)" != "$LLVM_COV_VERSION" ]; then
            cargo install --locked "cargo-llvm-cov@$LLVM_COV_VERSION"
          fi

      # The window layer's tests open real windows and read them back from the X server (fork_window::probe), so
      # they are measured under Xvfb, as the window smoke runs them; a display-less run would leave them unexecuted.
      - name: Display for the window tests
        if: ${{ matrix.component == 'window-layer' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libxkbcommon-x11-0 libxcursor1 libxi6
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          test -e /tmp/.X11-unix/X99
          { echo "DISPLAY=:99"; echo "NV_WINDOW_SMOKE=1"; echo "WINIT_UNIX_BACKEND=x11"; } >>"$GITHUB_ENV"

      - name: Measure this commit
        run: |
          set -euo pipefail
          mkdir -p out
          # shellcheck disable=SC2086
          cargo llvm-cov --locked --no-fail-fast --lcov --output-path out/lcov.info --ignore-filename-regex "$IGNORE" $ARGS 2>&1 | tail -n 40
          cargo llvm-cov report --summary-only --ignore-filename-regex "$IGNORE" | tail -n 3 | tee -a "$GITHUB_STEP_SUMMARY"

      # The baseline is the merge base of the pull request (docs/fork/COVERAGE.md): the lcov of the nightly (or manual)
      # run that measured exactly that commit; with none on it, the merge base measured here, so the delta is always
      # the pull request's own against the commit it started from. With no nightly run at all it is informational.
      - name: Baseline
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mb="$(git merge-base "$BASE" "$PR_HEAD" || echo "$BASE")"
          gh run list -R "$REPO" --workflow fork-coverage.yml --branch fork --status success --limit 100 \
            --json databaseId,headSha,event,conclusion >runs.json || echo '[]' >runs.json
          exact="$(python3 -I scripts/fork/coverage_report.py pick-run --runs runs.json --merge-base "$mb")"
          last="$(jq -r '[.[] | select(.event != "pull_request")][0] | "\(.databaseId // "") \(.headSha // "")"' runs.json)"
          if [ -n "$exact" ] && gh run download "$exact" -R "$REPO" -n "cov-$COMPONENT" -D baseline 2>/dev/null && [ -f baseline/lcov.info ]; then
            cp baseline/lcov.info out/base.info
            echo "the last nightly run, run $exact, on the merge base ${mb:0:10}" >out/baseline.txt
          else
            echo "no nightly run on the merge base ${mb:0:10}: measuring it"
            git worktree add --detach ../base "$mb"
            # shellcheck disable=SC2086
            (cd ../base && cargo llvm-cov --locked --no-fail-fast --lcov --output-path "$GITHUB_WORKSPACE/out/base.info" --ignore-filename-regex "$IGNORE" $ARGS 2>&1 | tail -n 5) || true
            if [ "${last%% *}" = "" ]; then
              echo "the base commit ${mb:0:10}, measured in this run" >out/baseline.txt
            else
              echo "the merge base ${mb:0:10}, measured in this run (the last nightly, run ${last%% *}, was on ${last##* })" >out/baseline.txt
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: cov-${{ matrix.component }}
          path: out
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: Coverage report
    needs: [plan, measure]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          # Only this workflow's artifacts (coverage-plan, cov-<component>), not the build's of the same run.
          pattern: 'cov*'
      - name: Render the comment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I scripts/fork/coverage_report.py report --dir artifacts --plan artifacts/coverage-plan/plan.json \
            --base "$BASE" --head "$HEAD" --out comment.md --json summary.json >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-comment
          path: |
            comment.md
            summary.json
          retention-days: 30

  # Changed-line coverage of the fork-owned crates (docs/fork/COVERAGE.md, "The gate"). Fails (and so fails Pipeline
  # Complete) only when .fork/coverage-gate.toml has `enforce = true`, a nightly baseline artifact exists and the
  # coverage is below the minimum; otherwise it passes with a report.
  coverage-gate:
    name: Coverage gate
    needs: [plan, measure]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          # Only this workflow's artifacts (coverage-plan, cov-<component>), not the build's of the same run.
          pattern: 'cov*'
      - name: Gate the fork-owned crates
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I scripts/fork/coverage_report.py gate --dir artifacts --plan artifacts/coverage-plan/plan.json \
            --base "$BASE" --head "$HEAD" --out gate.md | tee -a "$GITHUB_STEP_SUMMARY"

  comment:
    name: Coverage comment
    needs: report
    # A pull request from a fork has a read-only token; it still gets the run summary.
    if: ${{ !cancelled() && needs.report.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    # A failed comment (an API hiccup) must not fail Pipeline Complete: the gate decides, the comment only informs.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-comment
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- fork-coverage -->"))][0].id // empty')"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
