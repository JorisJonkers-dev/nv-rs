# Fork-only. release-please keeps a release PR open and, when it is merged, tags vX.Y.Z and creates the
# GitHub Release (org standard). It never touches Cargo.toml or Cargo.lock (release-type simple), so
# distribution/DEPENDENCY-LOCK.sha256 stays valid. The Linux tarball, the Windows ZIP and installer and the release files are built and attached by
# fork-release-build.yml, dispatched below (a tag made with the default token starts no workflow of its own).
name: Release

on:
  push:
    branches: [fork]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    # The fork's own App credentials live in this environment, readable only by runs on the fork branch.
    environment: fork-sync
    steps:
      # The release PR is authored with the fork's own App token so CI runs on it; falls back to GITHUB_TOKEN
      # (then CI does not run on the release PR and it needs a manual run).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.FORK_APP_ID }}
          private-key: ${{ secrets.FORK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the release build, with publishing, for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run fork-release-build.yml --repo "$REPO" --ref fork -f tag="$TAG" -f publish=true
