# Fork-only. Linux first: everything that can run on Linux runs here, and crates move here from
# fork-build-windows.yml as the Linux port progresses.
#  * Format (the whole workspace) always runs here.
#  * Probe: which workspace crates build on Linux today. Informational; its report is the job summary and the
#    crate list is uploaded as an artifact (promote it to .fork/linux-ok.txt).
#  * Clippy and tests of the crates listed in .fork/linux-ok.txt are REQUIRED (they must not regress).
# Actions minutes are free on a public repository, so more jobs cost nothing; they would not on a private one.
name: Build (Linux)

on:
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  probe:
    name: Probe (which crates build on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Informational: upstream is Windows-only today. Remove continue-on-error when the whole workspace builds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: fork-linux-probe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Probe
        run: python3 scripts/fork/linux_probe.py --out linux-ok.candidate | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-ok-candidate
          path: linux-ok.candidate

  plan:
    name: Plan Linux jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_crates: ${{ steps.plan.outputs.has_crates }}
      args: ${{ steps.plan.outputs.args }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: plan
        run: |
          crates="$(grep -Ev '^\s*(#|$)' .fork/linux-ok.txt || true)"
          if [ -z "$crates" ]; then echo "has_crates=false" >>"$GITHUB_OUTPUT"; echo "args=" >>"$GITHUB_OUTPUT"; exit 0; fi
          echo "has_crates=true" >>"$GITHUB_OUTPUT"
          args=""
          while IFS= read -r c; do args="$args -p $c"; done <<<"$crates"
          echo "args=$args" >>"$GITHUB_OUTPUT"

  clippy:
    name: Clippy (Linux crates)
    needs: plan
    if: ${{ needs.plan.outputs.has_crates == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: fork-linux-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - env:
          ARGS: ${{ needs.plan.outputs.args }}
        run: |
          # shellcheck disable=SC2086
          cargo clippy --locked $ARGS --all-targets -- -D warnings

  test:
    name: Test (Linux crates)
    needs: plan
    if: ${{ needs.plan.outputs.has_crates == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: '. -> target'
          shared-key: fork-linux-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - env:
          ARGS: ${{ needs.plan.outputs.args }}
        run: |
          # shellcheck disable=SC2086
          cargo test --locked $ARGS
