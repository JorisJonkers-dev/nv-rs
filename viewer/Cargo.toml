[package]
name = "nv-viewer"
version = "0.1.0"
description = "Runs Fallout: New Vegas through the engine port: the game's own translated code on the player's FalloutNV.exe"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Logging: levels, a JSON file, soft stops (docs/fork/LOGGING.md).
fork-log = { path = "../crates/fork-log" }
# The hitch flight recorder (docs/fork/HITCHES.md).
fork-hitch = { path = "../crates/fork-hitch" }
# The game's own translated code (crates/engine), started on the player's FalloutNV.exe.
host = { path = "../crates/host" }

# Discord Rich Presence (docs/fork/DISCORD.md): a background thread, off without an application ID.
fork-presence = { path = "../crates/fork-presence" }

# The memory timeline behind NV_MEMLOG (docs/fork/MEMLOG.md): off by default, no thread.
fork-memlog = { path = "../crates/fork-memlog" }
d3d9-wgpu = { path = "../crates/d3d9-wgpu" }
engine-core = { path = "../crates/engine-core" }
