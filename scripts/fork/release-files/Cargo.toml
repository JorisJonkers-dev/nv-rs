[package]
name = "release-files"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Fork-only: writes capabilities.json (from the built-in extenders' command tables) and release-manifest.json (docs/fork/RELEASE-FILES.md)."

[[bin]]
name = "release-files"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../../../crates/engine-core" }
nvse = { path = "../../../crates/nvse" }
jip = { path = "../../../crates/jip" }
jg = { path = "../../../crates/jg" }
showoff = { path = "../../../crates/showoff" }
knvse = { path = "../../../crates/knvse" }
stewie = { path = "../../../crates/stewie" }
ttw-nvse = { path = "../../../crates/ttw-nvse" }
anh-nvse = { path = "../../../crates/anh-nvse" }
serde_json = "1"
jsonschema = { version = "0.30", default-features = false }

# Standalone tool, not part of the root workspace (the root Cargo.toml is upstream's).
[workspace]
